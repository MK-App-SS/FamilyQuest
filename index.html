<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Famille — socle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:480px;margin:30px auto;padding:0 20px;color:#2a2340}
  h1{font-size:22px}
  h2{font-size:16px;color:#666;margin:22px 0 8px}
  label{font-size:13px;font-weight:700;color:#666;display:block;margin-top:10px}
  input,select{width:100%;padding:11px;margin:4px 0;border:2px solid #eee;border-radius:10px;font-size:15px;box-sizing:border-box}
  button{padding:11px 16px;margin-top:8px;border:0;border-radius:10px;background:#6c5ce7;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  button.secondary{background:#eee;color:#333}
  button.small{padding:6px 12px;font-size:13px}
  button.danger{background:none;color:#c00;padding:4px 8px;font-size:12px}
  .task{display:flex;justify-content:space-between;align-items:center;background:#f7f5ff;border-radius:12px;padding:12px 14px;margin-bottom:8px;gap:10px}
  .task b{display:block}
  .task span{font-size:13px;color:#666}
  .msg{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;white-space:pre-wrap}
  .msg.err{background:#ffe3e3;color:#b00}
  .msg.ok{background:#e3ffe9;color:#0a0}
  .stars{font-size:26px;font-weight:800;text-align:center;background:#fff8e1;border-radius:12px;padding:14px;margin-bottom:16px}
  .setup{background:#fff8e1;border-radius:12px;padding:14px;margin-bottom:20px}
  .card{background:#f7f5ff;border-radius:12px;padding:14px;margin-bottom:16px}
  .days{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .days label{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid #eee;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;color:#333;margin:0;cursor:pointer}
  .days input{width:auto;margin:0}
  .kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .kids label{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid #eee;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:#333;margin:0;cursor:pointer}
  .kids input{width:auto;margin:0}
  #app{display:none}
</style>
</head>
<body>

<div class="setup" id="setup">
  <label>Project URL</label>
  <input id="url" placeholder="https://xxxxxxxx.supabase.co">
  <label>Clé publique (anon)</label>
  <input id="key" placeholder="eyJhbGciOi...">
  <label>URL de la fonction pairing</label>
  <input id="fnurl" placeholder="https://xxxxxxxx.supabase.co/functions/v1/pairing">
  <button onclick="boot()">Continuer</button>
</div>

<div id="entry" style="display:none">
  <h1>🏡 Mission Famille</h1>
  <h2>Connexion parent</h2>
  <label>E-mail</label><input id="pemail" type="email">
  <label>Mot de passe</label><input id="ppass" type="password">
  <button onclick="parentLogin()">Se connecter</button>
  <h2>Connexion enfant (jumelage)</h2>
  <label>Code reçu du parent</label>
  <input id="pairCode" style="text-transform:uppercase;text-align:center">
  <button onclick="childPair()">Utiliser ce code</button>
  <div id="entryMsg" class="msg"></div>
</div>

<div id="app">
  <h1 id="hello"></h1>
  <button class="secondary small" onclick="logout()">Se déconnecter</button>

  <div id="parentView" style="display:none">
    <h2>Nouvelle mission récurrente</h2>
    <div class="card">
      <label>Titre</label><input id="ntitle" placeholder="Ex : Faire son lit">
      <label>Étoiles</label><input id="npoints" type="number" value="5">

      <label>Fréquence</label>
      <select id="nfreq" onchange="document.getElementById('daysBox').style.display=this.value==='weekly'?'block':'none'">
        <option value="daily">🔁 Chaque jour</option>
        <option value="weekly">📆 Certains jours</option>
      </select>
      <div id="daysBox" class="days" style="display:none">
        <label><input type="checkbox" value="1">Lun</label>
        <label><input type="checkbox" value="2">Mar</label>
        <label><input type="checkbox" value="3">Mer</label>
        <label><input type="checkbox" value="4">Jeu</label>
        <label><input type="checkbox" value="5">Ven</label>
        <label><input type="checkbox" value="6">Sam</label>
        <label><input type="checkbox" value="0">Dim</label>
      </div>

      <label>Moment de la journée</label>
      <select id="nslot">
        <option value="none">🕒 Peu importe</option>
        <option value="morning">☀️ Matin</option>
        <option value="day">🌤️ Journée</option>
        <option value="evening">🌙 Soir</option>
      </select>

      <label>Pour qui ? <span style="font-weight:400;color:#999">(rien de coché = à assigner plus tard)</span></label>
      <div id="kidsBox" class="kids"></div>

      <button onclick="createRecurring()">Créer la mission récurrente</button>
      <div id="createMsg" class="msg"></div>
    </div>

    <h2>Mes missions récurrentes</h2>
    <div id="recurringList"></div>

    <h2>Nouvelle mission spéciale</h2>
    <div class="card">
      <label>Titre</label><input id="stitle" placeholder="Ex : Laver la voiture">
      <label>Étoiles</label><input id="spoints" type="number" value="10">
      <label>Attribution</label>
      <select id="smode" onchange="document.getElementById('skidsBox').style.display=this.value==='each'?'flex':'none'">
        <option value="race">⚡ Tous — le premier qui la fait</option>
        <option value="each">👥 Enfants choisis — chacun doit la faire</option>
      </select>
      <div id="skidsBox" class="kids" style="display:none"></div>
      <button onclick="createSpecial()">Créer la mission spéciale</button>
      <div id="createSMsg" class="msg"></div>
    </div>

    <h2>Missions à valider</h2>
    <div id="pendingList"></div>
    <button class="secondary small" onclick="loadParent()">🔄 Actualiser</button>
  </div>

  <div id="childView" style="display:none">
    <div class="stars" id="starTotal"></div>
    <h2>Aujourd'hui</h2>
    <div id="myTasks"></div>
    <button class="secondary small" onclick="loadChild()">🔄 Actualiser</button>
  </div>
</div>

<script>
localStorage.setItem('mf_url', 'https://fpkuhwqsmnxhfbacksqa.supabase.co');
localStorage.setItem('mf_key', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwa3Vod3FzbW54aGZiYWNrc3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjMzODYsImV4cCI6MjEwNTk5OTM4Nn0.fIZe8gyQcxLYrT1sA_4dxlzulYmMgBpZoGfpXw49AoI');
localStorage.setItem('mf_fnurl', 'https://fpkuhwqsmnxhfbacksqa.supabase.co/functions/v1/https://fpkuhwqsmnxhfbacksqa.supabase.co/functions/v1/rapid-processor');

let client, me, myProfile, familyChildren = [];
const DAY_LABEL = {0:'dim.',1:'lun.',2:'mar.',3:'mer.',4:'jeu.',5:'ven.',6:'sam.'};
const SLOT_LABEL = {none:'', morning:'☀️ Matin', day:'🌤️ Journée', evening:'🌙 Soir'};
function todayStr(){ return new Date().toISOString().slice(0,10); }
function todayDow(){ return new Date().getDay(); }

window.addEventListener('load', () => {
  const u = localStorage.getItem('mf_url'), k = localStorage.getItem('mf_key'), f = localStorage.getItem('mf_fnurl');
  if(u) document.getElementById('url').value = u;
  if(k) document.getElementById('key').value = k;
  if(f) document.getElementById('fnurl').value = f;
});

async function boot(){
  const url = document.getElementById('url').value.trim();
  const key = document.getElementById('key').value.trim();
  const fnurl = document.getElementById('fnurl').value.trim();
  localStorage.setItem('mf_url', url); localStorage.setItem('mf_key', key); localStorage.setItem('mf_fnurl', fnurl);
  client = supabase.createClient(url, key);
  document.getElementById('setup').style.display = 'none';

  const { data: { session } } = await client.auth.getSession();
  if(session){ await afterLogin(); } else { document.getElementById('entry').style.display = 'block'; }
}

function showMsg(id, text, type){ const el=document.getElementById(id); el.textContent=text; el.className='msg '+(type||''); }

async function parentLogin(){
  const email = document.getElementById('pemail').value.trim();
  const password = document.getElementById('ppass').value;
  const { error } = await client.auth.signInWithPassword({ email, password });
  if(error){ showMsg('entryMsg', '❌ ' + error.message, 'err'); return; }
  await afterLogin();
}

async function childPair(){
  const code = document.getElementById('pairCode').value.trim().toUpperCase();
  const fnurl = document.getElementById('fnurl').value.trim();
  if(!fnurl){ showMsg('entryMsg', '❌ L’URL de la fonction pairing n’est pas renseignée (en haut de la page).', 'err'); return; }
  try{
    showMsg('entryMsg', 'Vérification du code...', '');
    const res = await fetch(fnurl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'redeem', code }) });
    const out = await res.json();
    if(!res.ok){ showMsg('entryMsg', '❌ ' + (out.error||res.statusText), 'err'); return; }
    const { error } = await client.auth.verifyOtp({ token_hash: out.token_hash, type: 'magiclink' });
    if(error){ showMsg('entryMsg', '❌ ' + error.message, 'err'); return; }
    await afterLogin();
  }catch(e){
    showMsg('entryMsg', '❌ Erreur technique : ' + e.message + '\n(vérifiez que l’URL de la fonction est correcte et complète)', 'err');
  }
}

async function afterLogin(){
  const { data: { user } } = await client.auth.getUser();
  me = user;
  const { data: profile } = await client.from('profiles').select('*').eq('id', me.id).single();
  myProfile = profile;
  document.getElementById('entry').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('hello').textContent = (profile.role==='parent'?'👋 ':'🙂 ') + profile.display_name;
  if(profile.role === 'parent'){
    document.getElementById('parentView').style.display = 'block';
    await loadChildrenList();
    await loadParent();
  } else {
    document.getElementById('childView').style.display = 'block';
    await loadChild();
  }
}

async function logout(){
  await client.auth.signOut();
  location.reload();
}

// ---------- PARENT ----------
async function loadChildrenList(){
  const { data } = await client.from('profiles').select('id, display_name').eq('family_id', myProfile.family_id).eq('role', 'child');
  familyChildren = data || [];
  document.getElementById('kidsBox').innerHTML =
    '<label><input type="checkbox" id="kidAll" onchange="toggleAllKids(this)">👨‍👩‍👧 Tous les enfants</label>' +
    familyChildren.map(c => '<label><input type="checkbox" class="kidPick" value="'+c.id+'">'+c.display_name+'</label>').join('');
  document.getElementById('skidsBox').innerHTML =
    familyChildren.map(c => '<label><input type="checkbox" class="skidPick" value="'+c.id+'">'+c.display_name+'</label>').join('');
}
function toggleAllKids(el){
  document.querySelectorAll('.kidPick').forEach(cb => { cb.checked = false; cb.disabled = el.checked; });
}

async function createRecurring(){
  const title = document.getElementById('ntitle').value.trim();
  const points = parseInt(document.getElementById('npoints').value, 10) || 5;
  const freq = document.getElementById('nfreq').value;
  const slot = document.getElementById('nslot').value;
  const assignAll = document.getElementById('kidAll').checked;
  const days = freq === 'weekly' ? [...document.querySelectorAll('#daysBox input:checked')].map(x=>parseInt(x.value,10)) : null;
  const pickedKids = [...document.querySelectorAll('.kidPick:checked')].map(x=>x.value);

  if(!title){ showMsg('createMsg', '❌ Un titre est nécessaire.', 'err'); return; }
  if(freq === 'weekly' && (!days || !days.length)){ showMsg('createMsg', '❌ Choisissez au moins un jour de la semaine.', 'err'); return; }

  const { data: task, error } = await client.from('tasks').insert({
    family_id: myProfile.family_id, title, points, recurring: true,
    assign_all: assignAll, freq, days, slot, created_by: me.id
  }).select().single();
  if(error){ showMsg('createMsg', '❌ ' + error.message, 'err'); return; }

  if(!assignAll && pickedKids.length){
    const { error: aerr } = await client.from('task_assignees').insert(
      pickedKids.map(cid => ({ task_id: task.id, child_id: cid, family_id: myProfile.family_id }))
    );
    if(aerr){ showMsg('createMsg', '❌ ' + aerr.message, 'err'); return; }
  }

  document.getElementById('ntitle').value = '';
  document.getElementById('kidAll').checked = false;
  document.querySelectorAll('.kidPick').forEach(cb => { cb.checked=false; cb.disabled=false; });
  showMsg('createMsg', assignAll || pickedKids.length ? '✅ Mission créée.' : '✅ Mission créée · à assigner plus tard.', 'ok');
  await loadRecurringList();
}

function freqLabel(t){
  if(t.freq !== 'weekly') return 'chaque jour';
  if(!t.days || !t.days.length) return 'chaque jour';
  if(t.days.length === 1) return 'le ' + ({0:'dimanche',1:'lundi',2:'mardi',3:'mercredi',4:'jeudi',5:'vendredi',6:'samedi'})[t.days[0]];
  return t.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DAY_LABEL[d]).join(', ');
}

async function loadRecurringList(){
  const { data: tasks } = await client.from('tasks').select('*, task_assignees(child_id, profiles(display_name))').eq('family_id', myProfile.family_id).eq('recurring', true).order('created_at');
  const el = document.getElementById('recurringList');
  if(!tasks || !tasks.length){ el.innerHTML = '<p style="color:#888">Aucune mission récurrente pour l’instant.</p>'; return; }
  el.innerHTML = tasks.map(t => {
    const who = t.assign_all ? '👨‍👩‍👧 Tous' : (t.task_assignees.length ? t.task_assignees.map(a=>a.profiles.display_name).join(' + ') : '⚠️ Non assignée');
    const meta = [who, SLOT_LABEL[t.slot]||'', t.points+' ⭐', freqLabel(t)].filter(Boolean).join(' · ');
    return '<div class="task"><div><b>'+t.title+'</b><span>'+meta+'</span></div><button class="danger" onclick="deleteTask(\''+t.id+'\')">🗑️</button></div>';
  }).join('');
}

async function deleteTask(taskId){
  if(!confirm('Supprimer cette mission ?')) return;
  const { error } = await client.from('tasks').delete().eq('id', taskId);
  if(error){ alert('❌ ' + error.message); return; }
  await loadRecurringList();
}

async function createSpecial(){
  const title = document.getElementById('stitle').value.trim();
  const points = parseInt(document.getElementById('spoints').value,10)||10;
  const mode = document.getElementById('smode').value;
  const picked = [...document.querySelectorAll('.skidPick:checked')].map(x=>x.value);
  if(!title){ showMsg('createSMsg','❌ Un titre est nécessaire.','err'); return; }
  if(mode==='each' && !picked.length){ showMsg('createSMsg','❌ Choisissez au moins un enfant.','err'); return; }

  const { data: task, error } = await client.from('tasks').insert({
    family_id: myProfile.family_id, title, points, recurring:false,
    assign_all: mode==='race', created_by: me.id
  }).select().single();
  if(error){ showMsg('createSMsg','❌ '+error.message,'err'); return; }

  if(mode==='each'){
    const { error: aerr } = await client.from('task_assignees').insert(picked.map(cid=>({task_id:task.id, child_id:cid, family_id:myProfile.family_id})));
    if(aerr){ showMsg('createSMsg','❌ '+aerr.message,'err'); return; }
  }
  document.getElementById('stitle').value='';
  showMsg('createSMsg','✅ Mission spéciale créée.','ok');
}

async function loadParent(){
  await loadRecurringList();
  const { data, error } = await client.from('task_logs').select('*, profiles!task_logs_child_id_fkey(display_name), tasks(assign_all,recurring)').eq('status', 'pending').order('created_at');
  const el = document.getElementById('pendingList');
  if(error){ el.textContent = '❌ ' + error.message; return; }
  if(!data.length){ el.innerHTML = '<p style="color:#888">Rien à valider pour le moment.</p>'; return; }
  el.innerHTML = data.map(l => {
    const canShare = l.tasks?.assign_all && !l.tasks?.recurring && familyChildren.length>1;
    const comment = l.comment ? '<br><i>💬 '+l.comment+'</i>' : '';
    return '<div class="task"><div><b>'+l.title+'</b><span>'+(l.profiles?.display_name||'?')+' · +'+l.points+' ⭐'+comment+'</span></div>'+
      '<div>'+(canShare?'<button class="small secondary" onclick="shareStars(\''+l.id+'\','+l.points+')">🤝</button> ':'')+
      '<button class="small" onclick="validate(\''+l.id+'\')">✅</button></div></div>';
  }).join('');
}

async function shareStars(logId, totalPoints){
  const name = prompt('Partager avec quel enfant ? (prénom exact)');
  if(!name) return;
  const kid = familyChildren.find(c=>c.display_name.toLowerCase()===name.trim().toLowerCase());
  if(!kid){ alert('Enfant introuvable : '+name); return; }
  const amt = parseInt(prompt('Combien d’étoiles pour '+kid.display_name+' ? (sur '+totalPoints+')'),10);
  if(!amt || amt<1 || amt>=totalPoints){ alert('Montant invalide.'); return; }
  await client.from('task_logs').update({ points: totalPoints-amt, status:'validated', validated_at:new Date().toISOString(), comment:null }).eq('id', logId);
  await client.from('task_shares').insert({ log_id: logId, child_id: kid.id, points: amt });
  await loadParent();
}

async function validate(logId){
  const { error } = await client.from('task_logs').update({ status: 'validated', validated_at: new Date().toISOString(), comment: null }).eq('id', logId);
  if(error){ alert('❌ ' + error.message); return; }
  await loadParent();
}

// ---------- ENFANT ----------
function isDueToday(t){
  if(t.freq === 'weekly') return (t.days||[]).includes(todayDow());
  return true;
}

async function loadChild(){
  const { data: assigned } = await client.from('task_assignees').select('task_id').eq('child_id', me.id);
  const assignedIds = new Set((assigned||[]).map(a=>a.task_id));

  const { data: allTasks } = await client.from('tasks').select('*').eq('family_id', myProfile.family_id).eq('recurring', true);
  const mine = (allTasks||[]).filter(t => t.assign_all || assignedIds.has(t.id));
  const dueToday = mine.filter(isDueToday);

  const { data: specials } = await client.from('tasks').select('*').eq('family_id', myProfile.family_id).eq('recurring', false);
  const myLogs = specials?.length ? (await client.from('task_logs').select('*').in('task_id', specials.map(t=>t.id))).data : [];
  const mySpecials = (specials||[]).filter(t => t.assign_all || assignedIds.has(t.id)).map(t => {
    const raceLog = t.assign_all ? (myLogs||[]).find(l=>l.task_id===t.id && (l.status==='pending'||l.status==='validated')) : null;
    return { t, taken: raceLog && raceLog.child_id!==me.id, myLog: (myLogs||[]).find(l=>l.task_id===t.id && l.child_id===me.id) };
  }).filter(x => !(x.t.assign_all && x.taken && !x.myLog));

  const { data: logsToday } = await client.from('task_logs').select('*').eq('child_id', me.id).eq('date', todayStr());
  const { data: validated } = await client.from('task_logs').select('points').eq('child_id', me.id).eq('status', 'validated');
  const { data: shares } = await client.from('task_shares').select('points').eq('child_id', me.id);
  const total = (validated||[]).reduce((s,l)=>s+l.points,0) + (shares||[]).reduce((s,l)=>s+l.points,0);
  document.getElementById('starTotal').textContent = '⭐ ' + total;

  const el = document.getElementById('myTasks');
  let html = '';
  mySpecials.forEach(({t, myLog}) => {
    let right = '<button class="small" onclick="doSpecial(\''+t.id+'\',\''+t.title.replace(/'/g,"\\'")+'\','+t.points+')">C’est fait !</button>';
    if(myLog?.status === 'pending') right = '<span style="font-size:13px;color:#b8860b">⏳ à valider</span>';
    if(myLog?.status === 'validated') right = '<span style="font-size:13px;color:#0a0">✅ validé</span>';
    html += '<div class="task"><div><b>✨ '+t.title+'</b><span>'+t.points+' ⭐ · '+(t.assign_all?'le premier qui la fait':'')+'</span></div>'+right+'</div>';
  });
  if(!dueToday.length && !mySpecials.length){ el.innerHTML = '<p style="color:#888">Aucune mission aujourd’hui.</p>'; return; }
  html += dueToday.map(t => {
    const log = (logsToday||[]).find(l => l.task_id === t.id);
    let right = '<button class="small" onclick="doTask(\''+t.id+'\',\''+t.title.replace(/'/g,"\\'")+'\','+t.points+')">C’est fait !</button>';
    if(log?.status === 'pending') right = '<span style="font-size:13px;color:#b8860b">⏳ à valider</span>';
    if(log?.status === 'validated') right = '<span style="font-size:13px;color:#0a0">✅ validé</span>';
    const meta = [SLOT_LABEL[t.slot]||'', t.points+' ⭐', freqLabel(t)].filter(Boolean).join(' · ');
    return '<div class="task"><div><b>'+t.title+'</b><span>'+meta+'</span></div>'+right+'</div>';
  }).join('');
  el.innerHTML = html;
}

async function doSpecial(taskId, title, points){
  const comment = prompt('Un petit mot pour tes parents ? (facultatif)') || null;
  const { error } = await client.from('task_logs').insert({
    family_id: myProfile.family_id, task_id: taskId, child_id: me.id, title, points, status:'pending', date: todayStr(), comment
  });
  if(error){ alert('❌ ' + error.message); return; }
  await loadChild();
}

async function doTask(taskId, title, points){
  const { error } = await client.from('task_logs').insert({
    family_id: myProfile.family_id, task_id: taskId, child_id: me.id, title, points, status: 'pending', date: todayStr()
  });
  if(error){ alert('❌ ' + error.message); return; }
  await loadChild();
}
</script>
</body>
</html>
