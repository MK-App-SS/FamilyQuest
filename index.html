<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fff7ea;--card:#ffffff;--ink:#2a2340;--muted:#7f7596;
  --pri:#6c5ce7;--pri-d:#5241c9;--pri-ink:#ffffff;--pri-soft:#eeeafd;
  --acc:#ffb020;--ok:#1fae6b;--ok-soft:#dff6ea;--bad:#e5484d;
  --warn-soft:#fff1cf;--line:#f0e4d0;--shadow:0 8px 24px rgba(70,50,130,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121f;--card:#221c31;--ink:#f4f0fb;--muted:#a99fc2;
    --pri:#8b7dff;--pri-d:#5f50e0;--pri-ink:#150f28;--pri-soft:#2f2751;
    --acc:#ffc247;--ok:#3ed08e;--ok-soft:#173a2d;--bad:#ff6b70;
    --warn-soft:#3c3216;--line:#352d47;--shadow:0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16121f;--card:#221c31;--ink:#f4f0fb;--muted:#a99fc2;
  --pri:#8b7dff;--pri-d:#5f50e0;--pri-ink:#150f28;--pri-soft:#2f2751;
  --acc:#ffc247;--ok:#3ed08e;--ok-soft:#173a2d;--bad:#ff6b70;
  --warn-soft:#3c3216;--line:#352d47;--shadow:0 8px 24px rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.logo,.hero-name,.t-title,.who-name,.brand{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{max-width:540px;margin:0 auto;padding:14px 16px 110px}
#app.nonav{padding-bottom:40px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:44px}
.logo{font-weight:800;font-size:22px}
.hello{font-size:30px;font-weight:800;margin:12px 0 8px;line-height:1.15}
.muted{color:var(--muted)}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:13px}

.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;background:var(--pri);color:var(--pri-ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--pri-d);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.go{background:var(--ok);box-shadow:0 4px 0 rgba(0,0,0,.18);color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px;min-height:36px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.ghost:active{transform:none;background:var(--pri-soft)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ghost-link{background:none;border:0;color:var(--muted);font-weight:800;font-size:15px;padding:10px 6px;cursor:pointer;min-height:44px}
.lnk{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}

/* entrée */
.entry{text-align:center;padding-top:16px}
.entry-logo{font-size:64px;line-height:1}
.brand{font-size:36px;font-weight:800;margin-top:6px}
.tag{color:var(--muted);font-weight:700;margin:6px 0 26px}
.bigbtn{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.bigbtn:active{transform:scale(.97)}
.bigbtn span{grid-row:1/3;font-size:44px;background:var(--pri-soft);width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.bigbtn b{font-family:'Baloo 2',sans-serif;font-size:22px;line-height:1.1;align-self:end}
.bigbtn small{color:var(--muted);font-weight:700;font-size:14px;align-self:start}

.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.who{border:0;background:var(--card);border-radius:24px;padding:22px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s}
.av{font-size:58px;line-height:1;background:var(--pri-soft);width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.av.sm{width:56px;height:56px;font-size:32px;flex:none}
.who-name{font-size:22px;font-weight:800;margin-top:6px}
.who-sub{font-size:13px;color:var(--muted);font-weight:700}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:800;min-width:18px;text-align:center;line-height:18px}

/* héros enfant */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.hero-av{font-size:50px;background:var(--pri-soft);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero-main{flex:1;min-width:0}
.hero-name{font-size:25px;font-weight:800;line-height:1.1}
.hero-lvl{font-weight:800;color:var(--pri);font-size:14px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 14px}
.stat{background:var(--warn-soft);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}

/* nav bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06);display:flex;justify-content:center}
.nav-in{display:flex;width:100%;max-width:540px;gap:4px}
.nb{flex:1;border:0;background:transparent;border-radius:14px;padding:7px 2px 6px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;position:relative;min-height:52px}
.nb .te{font-size:22px;line-height:1.2}
.nb.on{background:var(--pri-soft);color:var(--ink)}

.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.kid{display:flex;gap:12px;align-items:center;cursor:pointer}
.kid:active{transform:scale(.99)}
.chev{font-size:28px;line-height:1;color:var(--muted);font-weight:800;margin-left:6px;flex:none}

.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.empty .big{font-size:52px}

.sheet-inline{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;font-weight:700;min-height:48px}
.inp:focus{outline:none;border-color:var(--pri)}
.sherr{color:var(--bad);font-size:13px;margin-top:10px;font-weight:700}
.wel-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:-2px}
.ptop{margin-bottom:18px;align-items:flex-start}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:800;font-size:15px;opacity:0;transition:.25s;z-index:90;max-width:92%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Supabase (config en dur, clé publique anon) ---------- */
var SUPA_URL='https://fpkuhwqsmnxhfbacksqa.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwa3Vod3FzbW54aGZiYWNrc3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjMzODYsImV4cCI6MjEwNTk5OTM4Nn0.fIZe8gyQcxLYrT1sA_4dxlzulYmMgBpZoGfpXw49AoI';
var FN_URL='https://fpkuhwqsmnxhfbacksqa.supabase.co/functions/v1/rapid-processor';
var client=supabase.createClient(SUPA_URL,SUPA_KEY);

var AV=['🦊','🐼','🦁','🐸','🦄','🐯','🐵','🐙','🚀','🦖','🐱','🐶'];
function avatarFor(id){ var h=0; for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0; return AV[h%AV.length]; }

var ui={view:'loading', ptab:'today', tab:'missions', loginErr:null, loginBusy:false};
var S={me:null, profile:null, children:[], stars:0};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function todayFr(){ return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }

/* ---------- données ---------- */
async function computeStars(childId){
  var v=(await client.from('task_logs').select('points').eq('child_id',childId).eq('status','validated')).data||[];
  var s=(await client.from('task_shares').select('points').eq('child_id',childId)).data||[];
  var a=(await client.from('adjustments').select('points').eq('child_id',childId)).data||[];
  return v.reduce(function(t,l){return t+l.points},0)+s.reduce(function(t,l){return t+l.points},0)+a.reduce(function(t,l){return t+l.points},0);
}

// Recalcule le solde réel d'un enfant depuis les tables sources et le réécrit dans profiles.star_balance.
// À appeler après toute action qui change ses étoiles (validation, partage, ajustement, récompense donnée...).
async function recalcBalance(childId){
  var total=await computeStars(childId);
  var {error}=await client.from('profiles').update({star_balance:total}).eq('id',childId);
  if(error) console.error('recalcBalance error:',error);
  return total;
}

async function loadChildren(){
  var {data}=await client.from('profiles').select('id, display_name, star_balance').eq('family_id',S.profile.family_id).eq('role','child');
  S.children=data||[];
  S.children.forEach(function(c){ c.avatar=avatarFor(c.id); c.stars=c.star_balance||0; });
}

/* ---------- auth ---------- */
async function boot(){
  var {data:{session}}=await client.auth.getSession();
  if(session){ await afterLogin(); } else { ui.view='entry'; render(); }
}

async function afterLogin(){
  var {data:{user}}=await client.auth.getUser();
  S.me=user;
  var {data:profile}=await client.from('profiles').select('*').eq('id',user.id).single();
  if(!profile){ ui.view='entry'; ui.loginErr='Profil introuvable pour ce compte.'; render(); return; }
  S.profile=profile;
  if(profile.role==='parent'){
    await loadChildren();
    ui.view='parent'; ui.ptab='today';
  }else{
    S.stars=profile.star_balance||0;
    ui.view='child'; ui.tab='missions';
  }
  render();
}

/* ---------- vues ---------- */
function viewEntry(){
  return '<div class="entry"><div class="entry-logo">🏡</div><h1 class="brand">Mission Famille</h1><p class="tag">Les petites victoires du quotidien, en famille.</p>'+
    '<button class="bigbtn" data-a="toKidLogin"><span>🧒</span><b>Je suis un enfant</b><small>Rejoindre avec mon code</small></button>'+
    '<button class="bigbtn" data-a="toParentLogin"><span>👩‍👧</span><b>Je suis un parent</b><small>Me connecter</small></button></div>';
}
function viewParentLogin(){
  return '<header class="top"><button class="ghost-link" data-a="goEntry">← Retour</button></header>'+
    '<h1 class="hello">Connexion parent</h1>'+
    '<div class="sheet-inline">'+
    '<label class="lbl">E-mail</label><input class="inp" type="email" data-field="pemail" autocomplete="username">'+
    '<label class="lbl">Mot de passe</label><input class="inp" type="password" data-field="ppass" autocomplete="current-password">'+
    (ui.loginErr?'<p class="sherr">❌ '+esc(ui.loginErr)+'</p>':'')+
    '<button class="btn wide" style="margin-top:18px" data-a="doParentLogin">'+(ui.loginBusy?'Connexion...':'Se connecter')+'</button></div>';
}
function viewKidLogin(){
  return '<header class="top"><button class="ghost-link" data-a="goEntry">← Retour</button></header>'+
    '<h1 class="hello">Code famille</h1><p class="muted" style="margin:0 0 14px">Demande le code à tes parents. Tu ne le tapes qu’une seule fois sur cet appareil.</p>'+
    '<div class="sheet-inline">'+
    '<input class="inp" data-field="code" placeholder="Ex : LION42" maxlength="12" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:3px">'+
    (ui.loginErr?'<p class="sherr">❌ '+esc(ui.loginErr)+'</p>':'')+
    '<button class="btn wide" style="margin-top:14px" data-a="doChildPair">'+(ui.loginBusy?'Vérification...':'Entrer')+'</button></div>';
}

function navHtml(items,cur,act){
  return '<div class="nav"><div class="nav-in">'+items.map(function(t){
    return '<button class="nb '+(cur===t[0]?'on':'')+'" data-a="'+act+'" data-t="'+t[0]+'"><span class="te">'+t[1]+'</span>'+t[2]+'</button>';
  }).join('')+'</div></div>';
}
function parentNav(){ return navHtml([['today','🏠','Accueil'],['missions','📋','Missions'],['shop','🎁','Cadeaux'],['family','👪','Famille']],ui.ptab,'ptab'); }
function childNav(){ return navHtml([['missions','🎯','Missions'],['shop','🛍️','Boutique'],['trophies','🏆','Trophées']],ui.tab,'tab'); }

function comingSoon(txt){ return '<div class="empty"><div class="big">🚧</div><p>'+esc(txt)+'<br>Arrive à la prochaine étape.</p></div>'; }

function pToday(){
  if(!S.children.length) return '<h2 style="margin:18px 0 10px">Mes enfants</h2>'+'<div class="empty"><div class="big">👨‍👩‍👧</div><p>Aucun enfant pour l’instant.</p></div>';
  var kids=S.children.map(function(c){
    return '<div class="card kid"><div class="av sm">'+c.avatar+'</div><div style="flex:1;min-width:0"><b>'+esc(c.display_name)+'</b><div class="muted" style="font-size:13px">⭐ '+c.stars+'</div></div></div>';
  }).join('');
  return '<h2 style="margin:18px 0 10px">Mes enfants</h2>'+kids;
}

function viewParent(){
  var body = ui.ptab==='today' ? pToday()
    : ui.ptab==='missions' ? comingSoon('La gestion des missions et les validations')
    : ui.ptab==='shop' ? comingSoon('Les récompenses et les demandes')
    : comingSoon('Pauses, ajustements, badges et réglages de la famille');
  return '<header class="top ptop"><div><div class="hello">Bienvenue 👋</div><p class="wel-sub">'+esc(todayFr())+'</p></div>'+
    '<button class="ghost-link" data-a="logout">Déconnexion</button></header>'+body;
}

function viewChild(){
  var body = ui.tab==='missions' ? comingSoon('Tes missions du jour')
    : ui.tab==='shop' ? comingSoon('La boutique de récompenses')
    : comingSoon('Tes trophées et badges');
  return '<header class="top"><span></span><button class="ghost-link" data-a="logout">Déconnexion</button></header>'+
    '<section class="hero"><div class="hero-av">'+avatarFor(S.me.id)+'</div><div class="hero-main">'+
    '<div class="hero-name">Salut '+esc(S.profile.display_name)+' !</div>'+
    '<div class="chips"><span class="stat">⭐ '+S.stars+'</span></div></div></section>'+body;
}

/* ---------- rendu ---------- */
function render(){
  var h='',nav='';
  if(ui.view==='loading') h='<div class="empty" style="padding-top:80px"><div class="big">🏡</div><p>Chargement...</p></div>';
  else if(ui.view==='entry') h=viewEntry();
  else if(ui.view==='parentlogin') h=viewParentLogin();
  else if(ui.view==='kidlogin') h=viewKidLogin();
  else if(ui.view==='parent'){ h=viewParent(); nav=parentNav(); }
  else if(ui.view==='child'){ h=viewChild(); nav=childNav(); }
  var app=document.getElementById('app');
  app.className = nav ? '' : 'nonav';
  app.innerHTML = h+nav;
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.classList.remove('show')},2600);
}

/* ---------- actions ---------- */
var A={
  goEntry:function(){ ui.view='entry'; ui.loginErr=null; render(); },
  toKidLogin:function(){ ui.view='kidlogin'; ui.loginErr=null; render(); },
  toParentLogin:function(){ ui.view='parentlogin'; ui.loginErr=null; render(); },
  doParentLogin:async function(){
    var email=(document.querySelector('[data-field="pemail"]')||{}).value||'';
    var pass=(document.querySelector('[data-field="ppass"]')||{}).value||'';
    email=email.trim();
    if(!email||!pass){ ui.loginErr='Indique ton e-mail et ton mot de passe.'; render(); return; }
    ui.loginBusy=true; ui.loginErr=null; render();
    var {error}=await client.auth.signInWithPassword({email:email,password:pass});
    if(error){ ui.loginBusy=false; ui.loginErr=error.message; render(); return; }
    await afterLogin();
  },
  doChildPair:async function(){
    var code=((document.querySelector('[data-field="code"]')||{}).value||'').trim().toUpperCase();
    if(!code){ ui.loginErr='Entre ton code.'; render(); return; }
    ui.loginBusy=true; ui.loginErr=null; render();
    try{
      var res=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'redeem',code:code})});
      var out=await res.json();
      if(!res.ok){ ui.loginBusy=false; ui.loginErr=out.error||res.statusText; render(); return; }
      var {error}=await client.auth.verifyOtp({token_hash:out.token_hash,type:'magiclink'});
      if(error){ ui.loginBusy=false; ui.loginErr=error.message; render(); return; }
      await afterLogin();
    }catch(e){
      ui.loginBusy=false; ui.loginErr='Erreur technique : '+e.message; render();
    }
  },
  logout:async function(){ await client.auth.signOut(); location.reload(); },
  ptab:function(d){ ui.ptab=d.t; render(); },
  tab:function(d){ ui.tab=d.t; render(); }
};

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el)return;
  var fn=A[el.getAttribute('data-a')];
  if(fn)fn(el.dataset);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(ui.view==='parentlogin') A.doParentLogin();
  else if(ui.view==='kidlogin') A.doChildPair();
});

boot();
})();
</script>
</body>
</html>
