<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fff9ef;--card:#ffffff;--ink:#17233c;--muted:#7b7890;
  --pri:#ff6b5e;--pri-d:#e8564a;--pri-ink:#ffffff;--pri-soft:#fff0ee;
  --acc:#ffd166;--ok:#1fae6b;--ok-soft:#dff6ea;--bad:#e5484d;
  --warn-soft:#fff3d6;--line:#ede5d8;--shadow:0 8px 24px rgba(23,35,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121f;--card:#221c31;--ink:#f4f0fb;--muted:#a99fc2;
    --pri:#8b7dff;--pri-d:#5f50e0;--pri-ink:#150f28;--pri-soft:#2f2751;
    --acc:#ffc247;--ok:#3ed08e;--ok-soft:#173a2d;--bad:#ff6b70;
    --warn-soft:#3c3216;--line:#352d47;--shadow:0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16121f;--card:#221c31;--ink:#f4f0fb;--muted:#a99fc2;
  --pri:#8b7dff;--pri-d:#5f50e0;--pri-ink:#150f28;--pri-soft:#2f2751;
  --acc:#ffc247;--ok:#3ed08e;--ok-soft:#173a2d;--bad:#ff6b70;
  --warn-soft:#3c3216;--line:#352d47;--shadow:0 8px 24px rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.logo,.hero-name,.t-title,.who-name,.brand{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{max-width:540px;margin:0 auto;padding:14px 16px 110px}
#app.nonav{padding-bottom:40px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:44px}
.logo{font-weight:800;font-size:22px}
.hello{font-size:30px;font-weight:800;margin:12px 0 8px;line-height:1.15}
.muted{color:var(--muted)}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:13px}

.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;background:var(--pri);color:var(--pri-ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--pri-d);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.go{background:var(--ok);box-shadow:0 4px 0 rgba(0,0,0,.18);color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px;min-height:36px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.ghost:active{transform:none;background:var(--pri-soft)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ghost-link{background:none;border:0;color:var(--muted);font-weight:800;font-size:15px;padding:10px 6px;cursor:pointer;min-height:44px}
.lnk{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}

/* entrée */
.entry{text-align:center;padding-top:16px}
.entry-logo{font-size:64px;line-height:1}
.brand{font-size:36px;font-weight:800;margin-top:6px}
.tag{color:var(--muted);font-weight:700;margin:6px 0 26px}
.bigbtn{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.bigbtn:active{transform:scale(.97)}
.bigbtn span{grid-row:1/3;font-size:44px;background:var(--pri-soft);width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.bigbtn b{font-family:'Baloo 2',sans-serif;font-size:22px;line-height:1.1;align-self:end}
.bigbtn small{color:var(--muted);font-weight:700;font-size:14px;align-self:start}

.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.who{border:0;background:var(--card);border-radius:24px;padding:22px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s}
.av{font-size:58px;line-height:1;background:var(--pri-soft);width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.av.sm{width:56px;height:56px;font-size:32px;flex:none}
.who-name{font-size:22px;font-weight:800;margin-top:6px}
.who-sub{font-size:13px;color:var(--muted);font-weight:700}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:800;min-width:18px;text-align:center;line-height:18px}

/* héros enfant */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.hero-av{font-size:50px;background:var(--pri-soft);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero-main{flex:1;min-width:0}
.hero-name{font-size:25px;font-weight:800;line-height:1.1}
.hero-lvl{font-weight:800;color:var(--pri);font-size:14px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 14px}
.stat{background:var(--warn-soft);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}

/* animations parent */
.task.row-out,.task.row-out-no{overflow:hidden;pointer-events:none}
.task.row-out{animation:rowOk .7s ease-in forwards}
.task.row-out-no{animation:rowNo .6s ease-in forwards}
.task.row-out .ib.ok{animation:celBounce .5s ease-out}
@keyframes rowOk{0%{max-height:var(--h);background:var(--ok-soft)}25%{max-height:var(--h);background:var(--ok-soft);border-color:var(--ok);transform:scale(1.03)}60%{max-height:var(--h);opacity:1;transform:translateX(0)}100%{max-height:0;opacity:0;transform:translateX(70px);margin:0;padding-top:0;padding-bottom:0;border-width:0}}
@keyframes rowNo{0%{max-height:var(--h);background:#eee9e2}40%{max-height:var(--h);opacity:.8}100%{max-height:0;opacity:0;transform:translateX(-60px);margin:0;padding-top:0;padding-bottom:0;border-width:0}}
.float-star{position:fixed;z-index:95;font-weight:900;font-size:20px;color:#1F9D63;pointer-events:none;text-shadow:0 1px 0 #fff;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-64px) scale(1)}}
.spark{position:fixed;z-index:95;font-size:16px;pointer-events:none;animation:sparkOut .8s ease-out forwards}
@keyframes sparkOut{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
.btn-all{margin:2px 0 10px}
.modal-backdrop.enter{animation:celFade .2s ease-out}
.modal-backdrop.enter .modal{animation:modalUp .32s cubic-bezier(.2,1,.3,1)}
@keyframes modalUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.anim-in>*:not(.modal-backdrop){animation:fadeUp .28s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kid,.mcard,.task,.chip,.fitem,.ntf{transition:transform .12s ease}
.kid:active,.mcard:active{transform:scale(.985)}
.chip:active,.ntf:active{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){.task.row-out,.task.row-out-no,.modal-backdrop.enter,.modal-backdrop.enter .modal,.anim-in>*{animation:none}.float-star,.spark{display:none}}
/* boîtes de dialogue de l'appli */
.dlg-back{position:fixed;inset:0;z-index:120;background:rgba(23,35,60,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:celFade .18s ease-out;transition:opacity .15s}
.dlg-back.out{opacity:0}
.dlg{background:var(--card);color:var(--ink);border-radius:26px;padding:22px 20px 18px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:celPop .35s cubic-bezier(.2,1.3,.4,1) both;text-align:center}
.dlg-ico{font-size:44px;line-height:1;margin-bottom:6px}
.dlg-title{font-family:'Baloo 2','Nunito',sans-serif;font-size:21px;margin:4px 0}
.dlg-msg{color:var(--muted);font-weight:700;font-size:15px;margin:6px 0 4px;line-height:1.4;word-break:break-word}
.dlg-lbl{display:block;text-align:left;font-weight:800;font-size:13px;color:var(--muted);margin-top:12px}
.dlg .inp{width:100%;margin:6px 0 2px;text-align:left}
.dlg textarea.inp{min-height:84px;resize:vertical;font-family:inherit}
.dlg-err{color:var(--bad);font-weight:800;font-size:13px;margin:6px 0 0;text-align:left}
.dlg-btns{display:flex;gap:10px;margin-top:16px}
.dlg-btns .btn{flex:1}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 #b3363a}
.btn.danger:active{box-shadow:0 1px 0 #b3363a}
@media(prefers-reduced-motion:reduce){.dlg,.dlg-back{animation:none}}
/* valider à la place */
.task.row-flash{animation:rowFlash .8s ease-out}
@keyframes rowFlash{0%{background:var(--card)}30%{background:var(--ok-soft);border-color:var(--ok);transform:scale(1.03)}100%{background:var(--card)}}
.help-hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
/* images de missions */
.ico-img{width:84%;height:84%;object-fit:contain;display:block}
.ico-img.ico-photo{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ico-none{font-size:28px;opacity:.5}
.ico-block{display:flex;align-items:center;gap:12px}
.ico-prev{width:72px;height:72px;flex:none;border-radius:20px;background:var(--pri-soft);display:grid;place-items:center;overflow:hidden}
.ico-sugg{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.ico-th{width:48px;height:48px;border-radius:14px;border:2px solid transparent;background:var(--pri-soft);padding:0;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.ico-th.sel{border-color:var(--pri);background:#fff}
.ico-pk{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:10px}
.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:10px;max-height:220px;overflow-y:auto}
.ico-grid .ico-th{width:100%;height:52px}
/* célébration */
.cel-back{position:fixed;inset:0;z-index:90;background:rgba(23,35,60,.62);display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;animation:celFade .25s ease-out}
.cel{position:relative;background:var(--card,#fff);border-radius:30px;padding:26px 20px 20px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:celPop .55s cubic-bezier(.2,1.4,.4,1) both}
.cel-big{font-size:64px;line-height:1;display:inline-block;animation:celBounce 1.1s ease-in-out infinite}
.cel h2{font-family:'Baloo 2','Nunito',sans-serif;font-size:28px;margin:6px 0 2px}
.cel-sub{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px}
.cel-lvl{background:linear-gradient(135deg,var(--acc),var(--pri));border-radius:22px;padding:14px;margin:10px 0;font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:20px;color:#17233C;animation:celPulse 1.3s ease-in-out infinite}
.cel-sec{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;text-align:left}
.cel-row{display:flex;align-items:center;gap:10px;background:var(--pri-soft,#FFF0EE);border-radius:16px;padding:10px 12px;margin-bottom:6px;text-align:left;font-weight:800;opacity:0;animation:celSlide .45s ease-out forwards}
.cel-row .e{font-size:24px;flex:none}
.cel-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cel-row .sub{display:block;font-weight:700;font-size:12px;color:var(--muted);margin-top:2px;white-space:normal}
.cel-row .p{flex:none;color:#1F9D63;white-space:nowrap}
.cel-row.soft{background:#F3F1EC;font-weight:700}
.cel-total{margin:14px 0 4px;font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:34px;animation:celPulse 1.3s ease-in-out infinite}
.cel .btn{margin-top:12px}
.cel-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cel-conf i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;opacity:.95;animation:celFall linear infinite}
@keyframes celFade{from{opacity:0}to{opacity:1}}
@keyframes celPop{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes celBounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
@keyframes celPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes celSlide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes celFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.cel,.cel-big,.cel-lvl,.cel-total,.cel-conf i{animation:none}.cel-row{animation:none;opacity:1}.cel-conf{display:none}}
/* accueil enfant */
.hero .bar{height:16px}
.hero .bar i{background:linear-gradient(90deg,var(--acc),var(--pri))}
.hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 14px}
.stat{display:inline-flex;align-items:center;gap:6px}
.bico-row{display:flex;gap:6px;flex-wrap:wrap}
.bico{width:30px;height:30px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;font-size:15px;opacity:.45;filter:grayscale(1)}
.bico.on{opacity:1;filter:none;background:var(--acc)}
.hint{background:var(--warn-soft);border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px;margin-bottom:14px}
.slot-k{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:var(--muted);margin:18px 0 8px}
.ktask{padding:14px 16px;border-radius:24px}
.ktask .t-emoji{width:56px;height:56px;font-size:30px;border-radius:18px}
.ktask .t-title{font-family:'Baloo 2','Nunito',sans-serif;font-size:20px;font-weight:800}
.ktask .btn.go{padding:14px 20px;font-size:17px;border-radius:16px;min-height:52px}
/* nav bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06);display:flex;justify-content:center}
.nav-in{display:flex;width:100%;max-width:540px;gap:4px}
.nb{flex:1;border:0;background:transparent;border-radius:14px;padding:7px 2px 6px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;position:relative;min-height:52px}
.nb .te{font-size:22px;line-height:1.2}
.nb.on{background:var(--pri-soft);color:var(--ink)}

.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.kid{display:flex;gap:12px;align-items:center;cursor:pointer}
.kid:active{transform:scale(.99)}
.chev{font-size:28px;line-height:1;color:var(--muted);font-weight:800;margin-left:6px;flex:none}

.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.empty .big{font-size:52px}

.sheet-inline{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;font-weight:700;min-height:48px}
.inp:focus{outline:none;border-color:var(--pri)}
.sherr{color:var(--bad);font-size:13px;margin-top:10px;font-weight:700}
.wel-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:-2px}
.ptop{margin-bottom:18px;align-items:flex-start}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:800;font-size:15px;opacity:0;transition:.25s;z-index:90;max-width:92%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* missions */
.prog{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.prog-h{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px;gap:8px}
.bar{height:14px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.task,.reward{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border:2px solid transparent}
.task.pending{border-color:var(--acc);background:var(--warn-soft)}
.task.done{opacity:.8;background:var(--ok-soft)}
.task.done .t-title{text-decoration:line-through;text-decoration-thickness:2px}
.t-emoji{font-size:30px;flex:none;width:48px;height:48px;display:grid;place-items:center;background:var(--pri-soft);border-radius:16px}
.t-main{flex:1;min-width:0;display:block}
.t-title{font-size:18px;font-weight:700;line-height:1.15;display:block}
.t-meta{font-size:13px;color:var(--muted);font-weight:700;display:block}
.pill{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--pri-soft);color:var(--muted);white-space:nowrap;display:inline-block}
.pill.wait{background:var(--acc);color:#3a2a00}
.pill.ok{background:var(--ok);color:#fff}
.acts{display:flex;gap:8px;flex:none}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec h3{font-size:19px}
.slot-h{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:var(--muted);margin:14px 0 8px}
.ib{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.ib.ok{background:var(--ok-soft);border-color:var(--ok)}
.ib:active{transform:scale(.94)}
.special{background:linear-gradient(135deg,var(--pri-soft),var(--warn-soft));border:2px solid var(--acc);border-radius:24px;padding:14px 14px 4px;margin-bottom:18px}
.sp-h{display:flex;align-items:center;justify-content:space-between;font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:20px}
.sp-sub{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 10px}
.t-comment{display:block;font-size:13px;font-weight:700;font-style:italic;margin-top:3px}
.sharebtn{display:block;background:none;border:0;color:var(--pri);font-weight:800;font-size:13px;padding:8px 0 2px;cursor:pointer;text-align:left}
.seg{display:flex;gap:4px;background:var(--pri-soft);border-radius:18px;padding:4px;margin:4px 0 20px}
.seg button{flex:1;min-height:46px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.seg.sm button{flex:1 1 auto;min-width:0;font-size:12px;gap:3px;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.vhead h2{font-size:23px;line-height:1.15}
.vhead .btn{flex:none}
.vhint{font-size:14px;color:var(--muted);font-weight:700;margin:4px 0 18px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;cursor:pointer;min-height:42px}
.chip.sel{border-color:var(--pri);background:var(--pri-soft)}
.ntf{position:relative;background:none;border:0;cursor:pointer;font-size:20px;padding:4px;flex:none;line-height:1}
.ntf .dot{position:absolute;top:-4px;right:-6px}
.topacts{display:flex;gap:8px;flex:none}
.codebox-wrap{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);text-align:center}
.codebox{font-family:'Baloo 2',sans-serif;font-size:28px;font-weight:800;letter-spacing:4px;background:var(--pri-soft);border-radius:14px;padding:10px;margin-bottom:6px}
.badge-row{display:flex;gap:8px;margin-top:10px}
.badge-ico{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);display:grid;place-items:center;font-size:17px;opacity:.3;filter:grayscale(1);transition:.2s}
.badge-ico.on{opacity:1;filter:none;background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.15)}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,14,36,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:560px){.modal-backdrop{align-items:center}}
.modal{background:var(--card);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@media(min-width:560px){.modal{border-radius:26px;max-height:85vh;margin:20px}}

.modal-head h2{font-size:21px}
.modal-x{background:var(--pri-soft);border:0;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;color:var(--ink)}

.tile{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.tile-n{font-weight:800;font-size:17px}
.tile-l{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.weekstrip{display:flex;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 6px;box-shadow:var(--shadow);margin-bottom:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700}
.wd-i{font-size:16px}

.mcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:9px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mcard:active{transform:scale(.99)}
.mcard-ico{position:relative;width:44px;height:44px;flex:none;border-radius:13px;background:var(--pri-soft);display:grid;place-items:center;font-size:21px}
.mcard-star{position:absolute;bottom:-5px;right:-5px;background:var(--acc);color:#3a2a00;font-size:10px;font-weight:800;padding:1px 5px;border-radius:99px;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mcard-main{flex:1;min-width:0}
.mcard-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard-avatars{display:flex;flex:none;margin-left:4px}
.mcard-avatars span{font-size:24px;margin-left:-9px;background:var(--card);border-radius:50%;box-shadow:0 0 0 2px #000}

.fseg{display:flex;gap:2px;overflow-x:auto;margin-bottom:10px}
.fseg::-webkit-scrollbar{display:none}
.fitem{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:6px 10px 5px;border-radius:10px;cursor:pointer;white-space:nowrap}
.fitem.sel{background:var(--pri-soft);color:var(--ink);font-weight:800}
.fitem-dot{width:14px;height:3px;border-radius:99px;background:transparent}
.fitem.sel .fitem-dot{background:var(--pri)}

.kidgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.kidcard{background:var(--card);border-radius:18px;padding:16px 10px 12px;text-align:center;box-shadow:var(--shadow);position:relative}
.kidcard-gear{position:absolute;top:10px;right:10px;background:var(--pri-soft);border:0;width:28px;height:28px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--ink)}

  return iconNrm(q).split(' ').filter(function(x){return x&&x.length>1&&!/^\d+$/.test(x)&&!ICON_STOP[x]}).map(function(x){return x.length>3?x.replace(/(s|x)$/,''):x;});
}
// Renvoie [[score, fichier], ...] triés du plus au moins pertinent.
function iconSearch(q,limit){
  var ws=iconQueryWords(q); if(!ws.length) return [];
  var phrase=' '+ws.join(' ')+' ', res=[];
  iconPrep().forEach(function(p){
    var sc=0;
    ws.forEach(function(w){
      var hit=0;
      if(p.full.indexOf(' '+w+' ')>-1) hit=4;
      else if(p.full.indexOf(' '+w)>-1) hit=2;
      else if(w.length>3 && p.full.indexOf(w)>-1) hit=1;
      if(p.full.indexOf(' '+w+'s ')>-1) hit=Math.max(hit,5);
      if(!hit) return;
      sc+=hit;
      if(p.lab.indexOf(' '+w+' ')>-1||p.lab.indexOf(' '+w+'s ')>-1) sc+=2;
      if(p.cust && (p.cust.indexOf(' '+w+' ')>-1||p.cust.indexOf(' '+w+'s ')>-1||p.cust.indexOf(' '+w)>-1)) sc+=3;
      if(p.cfirst && (p.cfirst.indexOf(' '+w+' ')>-1||p.cfirst.indexOf(' '+w+'s ')>-1)) sc+=2;
    });
    if(!sc) return;
    if(ws.length>1 && p.stem.indexOf(phrase)>-1) sc+=6;
    res.push([sc,p.f]);
  });
  res.sort(function(a,b){return b[0]-a[0]});
  return limit?res.slice(0,limit):res;
}

function resizeToSquare(file,size){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var m=Math.min(img.width,img.height), sx=(img.width-m)/2, sy=(img.height-m)/2;
      var c=document.createElement('canvas'); c.width=c.height=size;
      c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,size,size);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?res(b):rej(new Error('Conversion impossible')); },'image/jpeg',0.85);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    img.src=url;
  });
}

// Renvoie le solde dépensable (balance) et le total d'étoiles gagnées (earned, sert au niveau : ne baisse jamais).
async function computeTotals(childId){
  var v=(await client.from('task_logs').select('points').eq('child_id',childId).eq('status','validated')).data||[];
  var s=(await client.from('task_shares').select('points').eq('child_id',childId)).data||[];
  var a=(await client.from('adjustments').select('points').eq('child_id',childId)).data||[];
  var sum=function(arr,f){ return arr.reduce(function(t,l){return t+(f?f(l):l.points)},0); };
  var pos=function(l){return l.points>0?l.points:0};
  return {balance:sum(v)+sum(s)+sum(a), earned:sum(v,pos)+sum(s,pos)+sum(a,pos)};
}
async function computeStars(childId){ return (await computeTotals(childId)).balance; }

// Recalcule le solde réel d'un enfant depuis les tables sources et le réécrit dans profiles.star_balance.
// À appeler après toute action qui change ses étoiles (validation, partage, ajustement, récompense donnée...).
async function recalcBalance(childId){
  var tt=await computeTotals(childId), total=tt.balance;
  var {data,error}=await client.from('profiles').update({star_balance:total, total_earned:tt.earned}).eq('id',childId).select();
  if(error){ console.error('recalcBalance error:',error); showAlert('⚠️ Le solde n’a pas pu être mis à jour : '+error.message); return total; }
  if(!data||!data.length){ console.warn('recalcBalance: 0 ligne mise à jour (RLS ?) pour', childId); showAlert('⚠️ Mission validée, mais le solde n’a pas été mis à jour (probablement une policy RLS sur profiles qui bloque l’update).'); }
  return total;
}

// Série en cours = nombre de jours consécutifs avec le badge "journée parfaite", en remontant depuis
// aujourd'hui (ou hier si la journée n'est pas encore terminée côté enfant).
async function computeStreak(childId){
  var {data}=await client.from('badges').select('period').eq('child_id',childId).eq('badge_id','perfectday');
  var set={}; (data||[]).forEach(function(b){ set[b.period]=true; });
  var d=todayStr();
  if(!set[d]) d=addDays(d,-1);
  var streak=0;
  while(set[d]){ streak++; d=addDays(d,-1); }
  return streak;
}

  var {data}=await client.from('profiles').select('id, display_name, star_balance, total_earned').eq('family_id',S.profile.family_id).eq('role','child');
  S.children=data||[];
  var {data:pars}=await client.from('profiles').select('id, display_name').eq('family_id',S.profile.family_id).eq('role','parent').order('display_name');
  S.parents=pars||[];
  for(var i=0;i<S.children.length;i++){
    var c=S.children[i];
    c.avatar=avatarFor(c.id);
    c.stars=c.star_balance||0;
    c.earned=Math.max(c.total_earned||0,c.stars);
    c.level=levelFor(c.earned);
    c.streak=await computeStreak(c.id);
    var {data:todayB}=await client.from('badges').select('badge_id').eq('child_id',c.id).eq('period',todayStr());
    c.todayBadgeIds=(todayB||[]).map(function(b){return b.badge_id});
  }
}

async function loadChildDetail(childId){
  var d=todayStr(), weekStart=addDays(d,-6);
  var {data:weekLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',weekStart).lte('date',d);
  var wl=weekLogs||[];
  var days=[], weekDue=0, weekDone=0;
  for(var i=6;i>=0;i--){
    var day=addDays(d,-i);
    var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,day)&&(!t.created_at||t.created_at.slice(0,10)<=day)});
    var dayLogs=wl.filter(function(l){return l.date===day});
    var paused=S.pauses.some(function(p){return (p.child_id===childId||!p.child_id)&&p.from_date<=day&&(!p.to_date||p.to_date>=day)});
    var complete=due.length>0 && due.every(function(t){return dayLogs.some(function(l){return l.task_id===t.id})});
    var status;
    if(paused) status='paused';
    else if(complete) status='ok';
    else if(day===d) status='today';
    else if(!due.length) status='none';
    else status='miss';
    days.push({date:day, dow:dowOf(day), status:status});
    if(!paused){
      due.forEach(function(t){
        weekDue++;
        if(dayLogs.some(function(l){return l.task_id===t.id})) weekDone++;
      });
    }
  }
  // Missions spéciales (ponctuelles) : comptées une seule fois chacune, pas par jour.
  // Les missions "premier arrivé" (assign_all) sont exclues : personne n'en est individuellement
  // responsable, donc ça ne doit ni aider ni pénaliser le taux de réussite d'un enfant en particulier.
  var mySpecials=S.tasks.filter(function(t){return !t.recurring && !t.assign_all && appliesToList(t,childId)});
  var specialValidated={};
  if(mySpecials.length){
    var {data:svLogs}=await client.from('task_logs').select('task_id,date').eq('child_id',childId).eq('status','validated').in('task_id',mySpecials.map(function(t){return t.id}));
    (svLogs||[]).forEach(function(l){ specialValidated[l.task_id]=l.date; });
  }
  // Spéciales créées dans les 7 derniers jours → comptent dans le taux de la semaine.
  mySpecials.forEach(function(t){
    var createdDate=t.created_at?t.created_at.slice(0,10):null;
    if(createdDate && createdDate>=weekStart && createdDate<=d){
      weekDue++;
      var vDate=specialValidated[t.id];
      if(vDate && vDate>=weekStart && vDate<=d) weekDone++;
    }
  });
  var weekRate=weekDue>0?Math.round(weekDone/weekDue*100):null;

  var {data:allPerfect}=await client.from('badges').select('period').eq('child_id',childId).eq('badge_id','perfectday').order('period');
  var periods=(allPerfect||[]).map(function(b){return b.period});
  var longest=0,run=0,prev=null;
  periods.forEach(function(p){ run=(prev&&addDays(prev,1)===p)?run+1:1; longest=Math.max(longest,run); prev=p; });

  // Taux de réussite global (sur les missions, pas les journées) : parmi toutes les missions récurrentes
  // dues depuis la toute première mission validée de l'enfant, + toutes les missions spéciales qui lui
  // ont été proposées, combien ont été effectivement validées.
  var {data:firstLog}=await client.from('task_logs').select('date').eq('child_id',childId).eq('status','validated').order('date',{ascending:true}).limit(1);
  var successRate=null;
  if(firstLog&&firstLog.length){
    var start=firstLog[0].date;
    var {data:histLogs}=await client.from('task_logs').select('task_id,date').eq('child_id',childId).eq('status','validated').gte('date',start).lte('date',d);
    var validatedSet={};
    (histLogs||[]).forEach(function(l){ validatedSet[l.date+'|'+l.task_id]=true; });
    var totalDue=0, totalDone=0, cursor=start;
    while(cursor<=d){
      var pausedThatDay=S.pauses.some(function(p){return (p.child_id===childId||!p.child_id)&&p.from_date<=cursor&&(!p.to_date||p.to_date>=cursor)});
      if(!pausedThatDay){
        var dueThatDay=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,cursor)&&(!t.created_at||t.created_at.slice(0,10)<=cursor)});
        dueThatDay.forEach(function(t){
          totalDue++;
          if(validatedSet[cursor+'|'+t.id]) totalDone++;
        });
      }
      cursor=addDays(cursor,1);
    }
    mySpecials.forEach(function(t){
      totalDue++;
      if(specialValidated[t.id]) totalDone++;
    });
    successRate=totalDue>0?Math.round(totalDone/totalDue*100):null;
  }

  var {data:allValidated}=await client.from('task_logs').select('points').eq('child_id',childId).eq('status','validated');
  var {data:allShares}=await client.from('task_shares').select('points').eq('child_id',childId);
  var {data:allAdj}=await client.from('adjustments').select('points').eq('child_id',childId);
  var earned=(allValidated||[]).reduce(function(s,l){return s+l.points},0)+(allShares||[]).reduce(function(s,l){return s+l.points},0)+(allAdj||[]).filter(function(a){return a.points>0}).reduce(function(s,a){return s+a.points},0);

  var {data:givenRedemptions}=await client.from('redemptions').select('*').eq('child_id',childId).eq('status','given').order('decided_at',{ascending:false});
  var {data:myBadges}=await client.from('badges').select('*').eq('child_id',childId);

  var {data:recentLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').order('validated_at',{ascending:false}).limit(6);
  var feed=[];
  (recentLogs||[]).forEach(function(l){ feed.push({type:'task', label:l.title, points:l.points, at:l.validated_at||l.date}); });
  (givenRedemptions||[]).slice(0,6).forEach(function(r){ feed.push({type:'reward', label:(r.emoji?r.emoji+' ':'')+r.title, points:-r.cost, at:r.decided_at}); });
  feed.sort(function(a,b){ return new Date(b.at)-new Date(a.at); });

  S.detail={childId:childId, days:days, longest:longest, earned:earned, missionsCount:(allValidated||[]).length, rewardsGiven:(givenRedemptions||[]).length, badges:myBadges||[], feed:feed.slice(0,8), successRate:successRate, weekRate:weekRate};
}

/* ---------- séries & badges ---------- */
function appliesToList(t,cid){ return t.assign_all || (t.task_assignees||[]).some(function(a){return a.child_id===cid}); }
function isDueOn(t,dateStr){ if(t.freq==='weekly') return (t.days||[]).indexOf(dowOf(dateStr))>-1; return true; }

async function awardBadge(childId,badgeId,scope,period,reward){
  var {data:existing,error:cErr}=await client.from('badges').select('id').eq('child_id',childId).eq('badge_id',badgeId).eq('period',period);
  if(cErr){ console.error('badge check error',cErr); return; }
  if(existing&&existing.length) return;
  var {error}=await client.from('badges').insert({family_id:S.profile.family_id, child_id:childId, badge_id:badgeId, scope:scope, period:period, reward:reward, seen:false});
  if(error){ console.error('badge insert error',error); return; }
  if(reward){
    var def=badgeDef(badgeId);
    await client.from('adjustments').insert({family_id:S.profile.family_id, child_id:childId, points:reward, reason:(def?def.emoji+' '+def.name:badgeId)});
    await recalcBalance(childId);
  }
}

async function checkBadges(childId){
  var d=todayStr(), monday=mondayOf(d);
  var {data:rangeLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',monday).lte('date',d);
  var logs=rangeLogs||[];
  function ownValidated(dateStr){ return logs.filter(function(l){return l.date===dateStr}); }
  function taskOf(l){ return S.tasks.filter(function(t){return t.id===l.task_id})[0]; }
  function strictRoutineDay(dateStr){
    var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,dateStr)&&(!t.created_at||t.created_at.slice(0,10)<=dateStr)});
    if(!due.length) return 'none';
    var v=ownValidated(dateStr);
    return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
  }

  if(ownValidated(d).length>=1) await awardBadge(childId,'kickoff','day',d,1);
  if(strictRoutineDay(d)==='ok') await awardBadge(childId,'perfectday','day',d,1);
  if(ownValidated(d).some(function(l){var t=taskOf(l); return t&&!t.recurring})) await awardBadge(childId,'helpinghand','day',d,1);
  var morningTasks=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,d)&&t.slot==='morning'});
  if(morningTasks.length){
    var allEarly=morningTasks.every(function(t){
      var l=ownValidated(d).filter(function(x){return x.task_id===t.id})[0];
      if(!l||!l.validated_at) return false;
      var vd=new Date(l.validated_at);
      return (vd.getHours()*60+vd.getMinutes())<9*60;
    });
    if(allEarly) await awardBadge(childId,'morningpro','day',d,1);
  }

  if(dowOf(d)===1){
    var prevMonday=addDays(monday,-7);
    var {data:prevWeekLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',prevMonday).lt('date',monday);
    var pLogs=prevWeekLogs||[];
    function pOwnValidated(dateStr){ return pLogs.filter(function(l){return l.date===dateStr}); }
    function pStrictRoutineDay(dateStr){
      var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,dateStr)&&(!t.created_at||t.created_at.slice(0,10)<=dateStr)});
      if(!due.length) return 'none';
      var v=pOwnValidated(dateStr);
      return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
    }
    var days=weekDatesFull(prevMonday), any=false, bad=false;
    days.forEach(function(x){ var k=pStrictRoutineDay(x); if(k==='ok')any=true; else if(k==='miss')bad=true; });
    if(any&&!bad) await awardBadge(childId,'perfectweek','week',prevMonday,5);
    if(days.every(function(x){return pOwnValidated(x).length>=5})) await awardBadge(childId,'ironregular','week',prevMonday,1);
  }

  var weekDays=weekDatesUpTo(d), specialCount=0, starSum=0;
  weekDays.forEach(function(x){
    var v=ownValidated(x);
    specialCount+=v.filter(function(l){var t=taskOf(l); return t&&!t.recurring}).length;
    starSum+=v.reduce(function(s,l){return s+l.points},0);
  });
  if(specialCount>=3) await awardBadge(childId,'bonushunter','week',monday,1);
  if(starSum>=40) await awardBadge(childId,'steadyeffort','week',monday,1);
}

async function afterLogin(){
  var {data:{user}}=await client.auth.getUser();
  S.me=user;
  var {data:profile}=await client.from('profiles').select('*').eq('id',user.id).single();
  if(!profile){ ui.view='entry'; ui.loginErr='Profil introuvable pour ce compte.'; render(); return; }
  S.profile=profile;
  if(profile.role==='parent'){
    await loadChildren();
    await loadParentData();
    ui.view='parent'; ui.ptab='today';
  }else{
    S.stars=profile.star_balance||0;
    S.earned=Math.max(profile.total_earned||0,S.stars);
    await loadChildData();
    await checkCelebration();
    ui.view='child'; ui.tab='missions';
  }
  render();
}

function animateRow(row,pts,delay,kind,label){
  return new Promise(function(res){
    if(!row||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ setTimeout(res,0); return; }
    setTimeout(function(){
      var r=row.getBoundingClientRect();
      row.style.setProperty('--h',r.height+'px');
      row.classList.add(kind==='no'?'row-out-no':(kind==='flash'?'row-flash':'row-out'));
      if(kind!=='no'){
        var t=document.createElement('div'); t.className='float-star'; t.textContent=label||('+'+pts+' ⭐');
        t.style.left=Math.max(8,r.right-90)+'px'; t.style.top=(r.top+r.height/2-14)+'px';
        document.body.appendChild(t); setTimeout(function(){t.remove()},1200);
        for(var i=0;i<8;i++){
          var sp=document.createElement('span'); sp.className='spark'; sp.textContent=i%2?'✨':'⭐';
          var a=Math.PI*2*i/8;
          sp.style.left=(r.right-60)+'px'; sp.style.top=(r.top+r.height/2)+'px';
          sp.style.setProperty('--dx',Math.round(Math.cos(a)*46)+'px'); sp.style.setProperty('--dy',Math.round(Math.sin(a)*46)+'px');
          document.body.appendChild(sp); (function(n){setTimeout(function(){n.remove()},900)})(sp);
        }
      }
      setTimeout(res,kind==='no'?600:700);
    },delay||0);
  });
}
function unanimateRow(row){ if(row){ row.classList.remove('row-out','row-out-no'); } }
async function validateCore(logId,cid){
  var {data:vlog,error}=await client.from('task_logs').update({status:'validated', validated_at:new Date().toISOString(), comment:null}).eq('id',logId).select('task_id');
  if(error) return error.message;
  var vt=vlog&&vlog[0]?S.tasks.filter(function(x){return x.id===vlog[0].task_id})[0]:null;
  if(vt && !vt.recurring){
    var unErr;
    if(vt.assign_all) unErr=(await client.from('tasks').update({assign_all:false}).eq('id',vt.id)).error;

function starStats(c){
  var week=0;
  S.tasks.forEach(function(t){ if(!t.recurring||!appliesToList(t,c.id)) return; week+=(t.points||0)*(t.freq==='weekly'?(t.days||[]).length:7); });
  var logs=(S.recentLogs||[]).filter(function(l){return l.child_id===c.id});
  var real=null;
  if(logs.length){
    var first=logs.reduce(function(m,l){return l.date<m?l.date:m},logs[0].date);
    var span=Math.round((new Date(todayStr())-new Date(first))/864e5)+1;
    var days=Math.min(28,Math.max(7,span));
    real=logs.reduce(function(t,l){return t+(l.points||0)},0)/days;
  }
  return {potWeek:week, potDay:week/7, realDay:real, realWeek:real==null?null:real*7};
}

    return '<div style="display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)"><span style="font-size:28px;flex:none">'+c.avatar+'</span><div style="min-width:0"><div style="font-weight:800">'+esc(c.display_name)+'</div><div style="font-size:13px;margin-top:2px">'+pot+'</div><div class="muted" style="font-size:13px">'+real+'</div></div></div>';

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,String(v));}catch(e){} }
async function checkCelebration(){
  try{
    var me=S.me.id, kLast='mf_seen_'+me, kLvl='mf_lvl_'+me;
    var last=lsGet(kLast), lastLvl=parseInt(lsGet(kLvl)||'0',10);
    var lvl=levelFor(S.earned||S.stars);
    if(!last){ lsSet(kLast,new Date().toISOString()); lsSet(kLvl,lvl); return; }
    var [rl,rr,rb,ra]=await Promise.all([
      client.from('task_logs').select('title,points,validated_at').eq('child_id',me).eq('status','validated').gt('validated_at',last).order('validated_at'),
      client.from('redemptions').select('title,emoji,cost,status,decided_at').eq('child_id',me).in('status',['given','refused']).gt('decided_at',last).order('decided_at'),
      client.from('badges').select('id,badge_id,reward,created_at').eq('child_id',me).gt('created_at',last).order('created_at'),
      client.from('adjustments').select('points,reason,created_at').eq('child_id',me).gt('created_at',last).order('created_at')
    ]);
    var missions=rl.data||[], gifts=(rr.data||[]).filter(function(r){return r.status==='given'}), refused=(rr.data||[]).filter(function(r){return r.status==='refused'});
    var badges=(rb.data||[]).filter(function(b){return badgeDef(b.badge_id)});
    var bonus=(ra.data||[]).filter(function(a){
      var r=a.reason||''; if(r.indexOf('🎁 ')===0) return false;
      return !BADGE_DEFS.some(function(b){return r===b.emoji+' '+b.name||r===b.id});
    });
    var levelUp=lvl>lastLvl&&lastLvl>0;
    if(!missions.length&&!gifts.length&&!refused.length&&!badges.length&&!bonus.length&&!levelUp){
      if(lvl>lastLvl) lsSet(kLvl,lvl);
      return;
    }
    var stars=0;
    missions.forEach(function(m){stars+=m.points||0});
    badges.forEach(function(b){stars+=b.reward||0});
    bonus.forEach(function(a){stars+=a.points||0});
    var stamps=[].concat(missions.map(function(x){return x.validated_at}),(rr.data||[]).map(function(x){return x.decided_at}),badges.map(function(x){return x.created_at}),bonus.map(function(x){return x.created_at})).filter(Boolean).sort();
    var colors=['#FF6B5E','#FFD166','#22B26B','#6C5CE7','#4FC3F7'], conf='';
    for(var i=0;i<28;i++) conf+='<i style="left:'+Math.round(Math.random()*100)+'%;background:'+colors[i%colors.length]+';animation-duration:'+(2.4+Math.random()*2.4).toFixed(1)+'s;animation-delay:-'+(Math.random()*4).toFixed(1)+'s"></i>';
    ui.celebrate={missions:missions,gifts:gifts,refused:refused,badges:badges,bonus:bonus,stars:stars,levelUp:levelUp?{lvl:lvl,title:levelTitle(lvl)}:null,lvl:lvl,stamp:stamps.length?stamps[stamps.length-1]:last,conf:conf};
  }catch(e){ console.error('celebration error',e); }
}

/* ---------- boîtes de dialogue (remplacent prompt / confirm / alert) ---------- */
var _openAlerts={};
function askDialog(o){
  return new Promise(function(resolve){
    var back=document.createElement('div'); back.className='dlg-back';
    var box=document.createElement('div'); box.className='dlg'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
    var multi=!!o.multiline, h='';
    if(o.icon) h+='<div class="dlg-ico">'+o.icon+'</div>';
    if(o.title) h+='<h3 class="dlg-title">'+esc(o.title)+'</h3>';
    if(o.message) h+='<p class="dlg-msg">'+esc(o.message).replace(/\n/g,'<br>')+'</p>';
    if(o.input){
      if(o.label) h+='<label class="dlg-lbl">'+esc(o.label)+'</label>';
      h+=(multi?'<textarea class="inp" rows="3"':'<input class="inp" type="'+(o.type||'text')+'"')+' placeholder="'+esc(o.placeholder||'')+'" autocomplete="off"'+(multi?'>'+esc(o.value||'')+'</textarea>':' value="'+esc(o.value||'')+'">');
      h+='<p class="dlg-err" hidden></p>';
    }
    h+='<div class="dlg-btns">'+(o.cancelLabel===null?'':'<button type="button" class="btn ghost" data-k="cancel">'+esc(o.cancelLabel||'Annuler')+'</button>')+
       '<button type="button" class="btn'+(o.danger?' danger':'')+'" data-k="ok">'+esc(o.okLabel||'OK')+'</button></div>';
    box.innerHTML=h; back.appendChild(box); document.body.appendChild(back);
    var inp=box.querySelector('.inp'), errEl=box.querySelector('.dlg-err');
    var prev=document.activeElement, done=false;
    function close(val){
      if(done) return; done=true;
      document.removeEventListener('keydown',onKey,true);
      back.classList.add('out'); setTimeout(function(){back.remove()},170);
      if(prev&&prev.focus){ try{prev.focus()}catch(e){} }
      resolve(val);
    }
    function cancel(){ close(o.input?null:false); }
    function submit(){
      if(o.input){
        var v=inp.value;
        if(o.validate){ var er=o.validate(v); if(er){ errEl.textContent=er; errEl.hidden=false; inp.focus(); return; } }
        close(v);
      } else close(true);
    }
    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); if(o.cancelLabel===null) submit(); else cancel(); }
      else if(e.key==='Enter' && !(multi&&!e.ctrlKey&&!e.metaKey) && !(e.target&&e.target.tagName==='BUTTON')){ e.preventDefault(); e.stopPropagation(); submit(); }
    }
    document.addEventListener('keydown',onKey,true);
    back.addEventListener('click',function(e){ if(e.target===back){ if(o.cancelLabel===null) submit(); else cancel(); } });
    box.querySelector('[data-k="ok"]').addEventListener('click',submit);
    var cb=box.querySelector('[data-k="cancel"]'); if(cb) cb.addEventListener('click',cancel);
    setTimeout(function(){ var f=inp||box.querySelector('[data-k="ok"]'); if(f){ f.focus(); if(inp&&inp.select&&o.type!=='password') inp.select(); } },60);
  });
}
function askConfirm(o){ return askDialog(Object.assign({icon:'❓',okLabel:'Confirmer'},o)); }
function askPrompt(o){ return askDialog(Object.assign({input:true,okLabel:'Valider'},o)); }
function showAlert(msg,o){
  msg=String(msg==null?'':msg);
  var m=msg.match(/^(❌|⚠️|✅)\s*/), icon=m?m[1]:'ℹ️', text=m?msg.slice(m[0].length):msg;
  if(_openAlerts[text]) return _openAlerts[text];
  var title=(o&&o.title)||(icon==='❌'?'Une erreur est survenue':icon==='⚠️'?'Attention':'Information');
  var pr=askDialog({icon:icon,title:title,message:text,okLabel:'OK',cancelLabel:null}).then(function(){ delete _openAlerts[text]; });
  _openAlerts[text]=pr; return pr;
}

function toast(msg){

  t.textContent=msg; t.classList.add('show');

    var title=(ui.rTitle||'').trim(), cost=parseInt(ui.rCost,10);
    if(!title){ toast('❌ Un titre est nécessaire'); return; }
    if(!cost||cost<1){ toast('❌ Indique un coût en étoiles'); return; }
    var fields={title:title, emoji:(ui.rEmoji||'').trim()||null, cost:cost};
    if(ui.editRewardId){
      var {error}=await client.from('rewards').update(fields).eq('id',ui.editRewardId);
      if(error){ showAlert('❌ '+error.message); return; }
    } else {
      var {error:cErr}=await client.from('rewards').insert(Object.assign({family_id:S.profile.family_id}, fields));
      if(cErr){ showAlert('❌ '+cErr.message); return; }
    }
    var wasEdit=!!ui.editRewardId;
    ui.rFormOpen=false; ui.editRewardId=null; ui.rTitle=''; ui.rEmoji=''; ui.rCost='10';
    toast(wasEdit?'✅ Récompense modifiée':'✅ Récompense créée');
    await loadParentData(); render();
  },
  deleteReward:async function(d){
    if(!(await askConfirm({icon:'🗑️',title:'Supprimer cette récompense ?',message:'Cette action est irréversible.',okLabel:'Supprimer',danger:true}))) return;
    await client.from('rewards').delete().eq('id',d.id);
    await loadParentData(); render();
  },
  openChildMenu:function(d){ ui.childMenu=d.id; render(); },
  closeChildMenu:function(){ ui.childMenu=null; render(); },
  menuRenameChild:function(d){ ui.childMenu=null; A.renameChild({id:d.id}); },
  menuDeleteChild:function(d){ ui.childMenu=null; A.deleteChild({id:d.id, name:d.name}); },
  openRewardMenu:function(d){ ui.rewardMenu=d.id; _rewardMenuOpenedAt=Date.now(); render(); },
  closeRewardMenu:function(){ if(Date.now()-_rewardMenuOpenedAt<400) return; ui.rewardMenu=null; render(); },
  menuEditReward:function(d){ ui.rewardMenu=null; A.editReward({id:d.id}); },
  menuDeleteReward:async function(d){ ui.rewardMenu=null; render(); await A.deleteReward({id:d.id}); },
  decideRedemption:async function(d,el){
    var row=el&&el.closest?el.closest('.task'):null;
    var anim=animateRow(row,0,0,d.decision==='given'?'ok':'no','🎁');
    var {error}=await client.from('redemptions').update({status:d.decision, decided_at:new Date().toISOString()}).eq('id',d.id);
    if(error){ unanimateRow(row); showAlert('❌ '+error.message); return; }
    if(d.decision==='given'){
      await client.from('adjustments').insert({family_id:S.profile.family_id, child_id:d.cid, points:-parseInt(d.cost,10), reason:'🎁 '+d.label});
      await recalcBalance(d.cid);
    }
    toast(d.decision==='given'?'🎁 Récompense donnée':'Demande refusée');
    await anim;
    await refreshParentScreen();
    closeValidateIfDone();
  },

  /* récompenses (enfant) */
  cancelRedemption:async function(d,btn){
    if(!(await askConfirm({icon:'↩️',title:'Annuler ta demande ?',message:'Ta demande de récompense sera retirée.',okLabel:'Oui, annuler',cancelLabel:'Non, la garder'}))) return;
    if(btn) btn.disabled=true;
    var {data,error}=await client.from('redemptions').delete().eq('id',d.id).eq('child_id',S.me.id).eq('status','pending').select();
    if(error){ if(btn) btn.disabled=false; showAlert('❌ '+error.message); return; }
    if(!data||!data.length){
      toast('Cette demande a déjà été traitée par tes parents');
    } else toast('↩️ Demande annulée');
    await refreshChildScreen();
  },
  requestReward:async function(d, btn){
    if(btn){ btn.disabled=true; btn.textContent='...'; }
    if(S.stars<+d.cost){ showAlert('Pas assez d’étoiles pour cette récompense.'); if(btn){btn.disabled=false; btn.textContent='Demander';} return; }
    var already=(S.myRedemptions||[]).some(function(r){return r.reward_id===d.id&&r.status==='pending'});
    if(already){ await refreshChildScreen(); return; }
    var {error}=await client.from('redemptions').insert({family_id:S.profile.family_id, child_id:S.me.id, reward_id:d.id, title:d.title, emoji:d.emoji||null, cost:+d.cost, status:'pending'});
    if(error){ showAlert('❌ '+error.message); return; }
    toast('🎁 Demande envoyée !');
    await refreshChildScreen();
  }
};

/* appui long sur une carte de mission -> menu Assigner/Éditer/Supprimer */
var _lpTimer=null, _taskMenuOpenedAt=0, _rewardMenuOpenedAt=0;
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest?e.target.closest('[data-longpress]'):null;
  if(el){
    var id=el.getAttribute('data-longpress');
    _lpTimer=setTimeout(function(){ _lpTimer=null; A.openTaskMenu({id:id}); },500);
    return;
  }
  var rel=e.target.closest?e.target.closest('[data-longpress-reward]'):null;
  if(rel){
    var rid=rel.getAttribute('data-longpress-reward');
    _lpTimer=setTimeout(function(){ _lpTimer=null; A.openRewardMenu({id:rid}); },500);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(function(evt){
  document.addEventListener(evt,function(){ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } });
});

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el)return;
  var fn=A[el.getAttribute('data-a')];
  if(fn)fn(el.dataset, el);
});
document.addEventListener('input',function(e){
  var el=e.target, f=el.dataset && el.dataset.field;
  if(!f) return;
  if(f==='ntitle'){ ui.newTitle=el.value; if(!ui.newIconManual) ui.newIcon=autoIcon(el.value); refreshIconUI(el.value); }
  else if(f==='npoints') ui.newPoints=el.value;
  else if(f==='stitle'){ ui.newSTitle=el.value; if(!ui.newIconManual) ui.newIcon=autoIcon(el.value); refreshIconUI(el.value); }
  else if(f==='iconSearch'){ ui.iconSearch=el.value; var g=document.getElementById('ico-results'); if(g) g.innerHTML=iconResultsHtml(el.value); }
  else if(f==='spoints') ui.newSPoints=el.value;
  else if(f==='pauseFrom') ui.pauseFrom=el.value;
  else if(f==='pauseTo') ui.pauseTo=el.value;
  else if(f==='pauseReason') ui.pauseReason=el.value;
  else if(f==='pauseChild') ui.pauseChild=el.value;
  else if(f==='adjChild') ui.adjChild=el.value;
  else if(f==='adjPoints') ui.adjPoints=el.value;
  else if(f==='adjReason') ui.adjReason=el.value;
  else if(f==='rTitle') ui.rTitle=el.value;
  else if(f==='rEmoji') ui.rEmoji=el.value;
  else if(f==='rCost') ui.rCost=el.value;
});
document.addEventListener('change',function(e){
  var el=e.target, f=el.dataset && el.dataset.field;
  if(f==='iconFile'){ var fl=el.files&&el.files[0]; el.value=''; A.uploadIcon(fl); return; }
  if(!f || el.tagName!=='SELECT') return;
  if(f==='pauseChild') ui.pauseChild=el.value;
  else if(f==='adjChild') ui.adjChild=el.value;
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(ui.view==='parentlogin') A.doParentLogin();
  else if(ui.view==='kidlogin') A.doChildPair();
});

boot();
})();
</script>
</body>
