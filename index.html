<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fff7ea;--card:#ffffff;--ink:#2a2340;--muted:#7f7596;
  --pri:#6c5ce7;--pri-d:#5241c9;--pri-ink:#ffffff;--pri-soft:#eeeafd;
  --acc:#ffb020;--ok:#1fae6b;--ok-soft:#dff6ea;--bad:#e5484d;
  --warn-soft:#fff1cf;--line:#f0e4d0;--shadow:0 8px 24px rgba(70,50,130,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121f;--card:#221c31;--ink:#f4f0fb;--muted:#a99fc2;
    --pri:#8b7dff;--pri-d:#5f50e0;--pri-ink:#150f28;--pri-soft:#2f2751;
    --acc:#ffc247;--ok:#3ed08e;--ok-soft:#173a2d;--bad:#ff6b70;
    --warn-soft:#3c3216;--line:#352d47;--shadow:0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16121f;--card:#221c31;--ink:#f4f0fb;--muted:#a99fc2;
  --pri:#8b7dff;--pri-d:#5f50e0;--pri-ink:#150f28;--pri-soft:#2f2751;
  --acc:#ffc247;--ok:#3ed08e;--ok-soft:#173a2d;--bad:#ff6b70;
  --warn-soft:#3c3216;--line:#352d47;--shadow:0 8px 24px rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.logo,.hero-name,.t-title,.who-name,.brand{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{max-width:540px;margin:0 auto;padding:14px 16px 110px}
#app.nonav{padding-bottom:40px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:44px}
.logo{font-weight:800;font-size:22px}
.hello{font-size:30px;font-weight:800;margin:12px 0 8px;line-height:1.15}
.muted{color:var(--muted)}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:13px}

.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;background:var(--pri);color:var(--pri-ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--pri-d);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.go{background:var(--ok);box-shadow:0 4px 0 rgba(0,0,0,.18);color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px;min-height:36px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.ghost:active{transform:none;background:var(--pri-soft)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ghost-link{background:none;border:0;color:var(--muted);font-weight:800;font-size:15px;padding:10px 6px;cursor:pointer;min-height:44px}
.lnk{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}

/* entrée */
.entry{text-align:center;padding-top:16px}
.entry-logo{font-size:64px;line-height:1}
.brand{font-size:36px;font-weight:800;margin-top:6px}
.tag{color:var(--muted);font-weight:700;margin:6px 0 26px}
.bigbtn{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.bigbtn:active{transform:scale(.97)}
.bigbtn span{grid-row:1/3;font-size:44px;background:var(--pri-soft);width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.bigbtn b{font-family:'Baloo 2',sans-serif;font-size:22px;line-height:1.1;align-self:end}
.bigbtn small{color:var(--muted);font-weight:700;font-size:14px;align-self:start}

.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.who{border:0;background:var(--card);border-radius:24px;padding:22px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s}
.av{font-size:58px;line-height:1;background:var(--pri-soft);width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.av.sm{width:56px;height:56px;font-size:32px;flex:none}
.who-name{font-size:22px;font-weight:800;margin-top:6px}
.who-sub{font-size:13px;color:var(--muted);font-weight:700}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:800;min-width:18px;text-align:center;line-height:18px}

/* héros enfant */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.hero-av{font-size:50px;background:var(--pri-soft);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero-main{flex:1;min-width:0}
.hero-name{font-size:25px;font-weight:800;line-height:1.1}
.hero-lvl{font-weight:800;color:var(--pri);font-size:14px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 14px}
.stat{background:var(--warn-soft);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}

/* nav bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06);display:flex;justify-content:center}
.nav-in{display:flex;width:100%;max-width:540px;gap:4px}
.nb{flex:1;border:0;background:transparent;border-radius:14px;padding:7px 2px 6px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;position:relative;min-height:52px}
.nb .te{font-size:22px;line-height:1.2}
.nb.on{background:var(--pri-soft);color:var(--ink)}

.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.kid{display:flex;gap:12px;align-items:center;cursor:pointer}
.kid:active{transform:scale(.99)}
.chev{font-size:28px;line-height:1;color:var(--muted);font-weight:800;margin-left:6px;flex:none}

.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.empty .big{font-size:52px}

.sheet-inline{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;font-weight:700;min-height:48px}
.inp:focus{outline:none;border-color:var(--pri)}
.sherr{color:var(--bad);font-size:13px;margin-top:10px;font-weight:700}
.wel-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:-2px}
.ptop{margin-bottom:18px;align-items:flex-start}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:800;font-size:15px;opacity:0;transition:.25s;z-index:90;max-width:92%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* missions */
.prog{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.prog-h{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px;gap:8px}
.bar{height:14px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.task,.reward{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border:2px solid transparent}
.task.pending{border-color:var(--acc);background:var(--warn-soft)}
.task.done{opacity:.8;background:var(--ok-soft)}
.task.done .t-title{text-decoration:line-through;text-decoration-thickness:2px}
.t-emoji{font-size:30px;flex:none;width:48px;height:48px;display:grid;place-items:center;background:var(--pri-soft);border-radius:16px}
.t-main{flex:1;min-width:0;display:block}
.t-title{font-size:18px;font-weight:700;line-height:1.15;display:block}
.t-meta{font-size:13px;color:var(--muted);font-weight:700;display:block}
.pill{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--pri-soft);color:var(--muted);white-space:nowrap;display:inline-block}
.pill.wait{background:var(--acc);color:#3a2a00}
.pill.ok{background:var(--ok);color:#fff}
.acts{display:flex;gap:8px;flex:none}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec h3{font-size:19px}
.slot-h{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:var(--muted);margin:14px 0 8px}
.ib{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.ib.ok{background:var(--ok-soft);border-color:var(--ok)}
.ib:active{transform:scale(.94)}
.special{background:linear-gradient(135deg,var(--pri-soft),var(--warn-soft));border:2px solid var(--acc);border-radius:24px;padding:14px 14px 4px;margin-bottom:18px}
.sp-h{display:flex;align-items:center;justify-content:space-between;font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:20px}
.sp-sub{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 10px}
.t-comment{display:block;font-size:13px;font-weight:700;font-style:italic;margin-top:3px}
.sharebtn{display:block;background:none;border:0;color:var(--pri);font-weight:800;font-size:13px;padding:8px 0 2px;cursor:pointer;text-align:left}
.seg{display:flex;gap:4px;background:var(--pri-soft);border-radius:18px;padding:4px;margin:4px 0 20px}
.seg button{flex:1;min-height:46px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.vhead h2{font-size:23px;line-height:1.15}
.vhead .btn{flex:none}
.vhint{font-size:14px;color:var(--muted);font-weight:700;margin:4px 0 18px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;cursor:pointer;min-height:42px}
.chip.sel{border-color:var(--pri);background:var(--pri-soft)}
.ntf{position:relative;background:none;border:0;cursor:pointer;font-size:20px;padding:4px;flex:none;line-height:1}
.ntf .dot{position:absolute;top:-4px;right:-6px}
.topacts{display:flex;gap:8px;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Supabase (config en dur, clé publique anon) ---------- */
var SUPA_URL='https://fpkuhwqsmnxhfbacksqa.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwa3Vod3FzbW54aGZiYWNrc3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjMzODYsImV4cCI6MjEwNTk5OTM4Nn0.fIZe8gyQcxLYrT1sA_4dxlzulYmMgBpZoGfpXw49AoI';
var FN_URL='https://fpkuhwqsmnxhfbacksqa.supabase.co/functions/v1/rapid-processor';
var client=supabase.createClient(SUPA_URL,SUPA_KEY);

var AV=['🦊','🐼','🦁','🐸','🦄','🐯','🐵','🐙','🚀','🦖','🐱','🐶'];
function avatarFor(id){ var h=0; for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0; return AV[h%AV.length]; }

var DAY_LABEL={0:'dim.',1:'lun.',2:'mar.',3:'mer.',4:'jeu.',5:'ven.',6:'sam.'};
var DAY_FULL={0:'dimanche',1:'lundi',2:'mardi',3:'mercredi',4:'jeudi',5:'vendredi',6:'samedi'};
var SLOT_LABEL={none:'🕒 Peu importe',morning:'☀️ Matin',day:'🌤️ Journée',evening:'🌙 Soir'};
function todayStr(){ return new Date().toISOString().slice(0,10); }
function todayDow(){ return new Date().getDay(); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ var p=s.split('-').map(Number); return ymd(new Date(p[0],p[1]-1,p[2]+n)); }
function dowOf(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).getDay(); }
function mondayOf(s){ var dw=dowOf(s),diff=dw===0?-6:1-dw; return addDays(s,diff); }
function weekDatesFull(monday){ var a=[]; for(var i=0;i<7;i++)a.push(addDays(monday,i)); return a; }
function weekDatesUpTo(d){ var mon=mondayOf(d),a=[],cur=mon; while(cur<=d){a.push(cur);cur=addDays(cur,1);} return a; }

var BADGE_DEFS=[
  {id:'kickoff',scope:'day',emoji:'🚀',name:'Coup d’envoi',reward:1,desc:'Valider sa toute première mission de la journée.'},
  {id:'perfectday',scope:'day',emoji:'🌟',name:'Journée parfaite',reward:1,desc:'Valider toutes les routines quotidiennes du jour.'},
  {id:'helpinghand',scope:'day',emoji:'🙌',name:'Coup de main',reward:1,desc:'Valider au moins une mission spéciale aujourd’hui.'},
  {id:'morningpro',scope:'day',emoji:'🌅',name:'Matin efficace',reward:1,desc:'Valider toutes les routines du matin avant 9h00.'},
  {id:'perfectweek',scope:'week',emoji:'🏆',name:'Semaine parfaite',reward:5,desc:'Toutes les routines quotidiennes validées, chaque jour de la semaine.'},
  {id:'ironregular',scope:'week',emoji:'💪',name:'Régularité de fer',reward:1,desc:'Valider au moins 5 missions chaque jour, 7 jours d’affilée.'},
  {id:'bonushunter',scope:'week',emoji:'🎯',name:'Chasseur de bonus',reward:1,desc:'Valider au moins 3 missions spéciales cette semaine.'},
  {id:'steadyeffort',scope:'week',emoji:'💎',name:'Effort constant',reward:1,desc:'Accumuler au moins 40 étoiles cette semaine.'}
];
function badgeDef(id){ return BADGE_DEFS.filter(function(b){return b.id===id})[0]; }
function freqLabel(t){
  if(t.freq!=='weekly') return 'chaque jour';
  if(!t.days||!t.days.length) return 'chaque jour';
  if(t.days.length===1) return 'le '+DAY_FULL[t.days[0]];
  return t.days.slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7)}).map(function(d){return DAY_LABEL[d]}).join(', ');
}
function isDueToday(t){
  if(t.freq==='weekly') return (t.days||[]).indexOf(todayDow())>-1;
  return true;
}
function appliesTo(t,cid){ return t.assign_all || (t.task_assignees||[]).some(function(a){return a.child_id===cid}); }
function whoLabel(t){
  if(t.assign_all) return '👨‍👩‍👧 Tous';
  var ids=(t.task_assignees||[]).map(function(a){return a.child_id});
  if(!ids.length) return '⚠️ Non assignée';
  var names=ids.map(function(id){ var c=S.children.filter(function(x){return x.id===id})[0]; return c?c.display_name:'?'; });
  return names.join(' + ');
}

var ui={view:'loading', ptab:'today', tab:'missions', loginErr:null, loginBusy:false,
  mview:'daily', newOpen:false, newFreq:'daily', newSlot:'none', newAssignAll:false, newPicked:[], newDays:[],
  newSMode:'race', newSPicked:[], newTitle:'', newPoints:'5', newSTitle:'', newSPoints:'10',
  expandChild:null,
  fview:'pauses', sview:'rewards',
  pauseChild:'', pauseFrom:todayStr(), pauseTo:'',
  adjChild:'', adjPoints:'', adjReason:'',
  rTitle:'', rEmoji:'', rCost:'10'};
var S={me:null, profile:null, children:[], stars:0, tasks:[], logs:[], mySpecials:[], myLogsToday:[],
  pauses:[], adjustments:[], badges:[], rewards:[], redemptions:[], myPause:null, myBadges:[], myRedemptions:[]};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function todayFr(){ return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }

/* ---------- données ---------- */
async function computeStars(childId){
  var v=(await client.from('task_logs').select('points').eq('child_id',childId).eq('status','validated')).data||[];
  var s=(await client.from('task_shares').select('points').eq('child_id',childId)).data||[];
  var a=(await client.from('adjustments').select('points').eq('child_id',childId)).data||[];
  return v.reduce(function(t,l){return t+l.points},0)+s.reduce(function(t,l){return t+l.points},0)+a.reduce(function(t,l){return t+l.points},0);
}

// Recalcule le solde réel d'un enfant depuis les tables sources et le réécrit dans profiles.star_balance.
// À appeler après toute action qui change ses étoiles (validation, partage, ajustement, récompense donnée...).
async function recalcBalance(childId){
  var total=await computeStars(childId);
  var {data,error}=await client.from('profiles').update({star_balance:total}).eq('id',childId).select();
  if(error){ console.error('recalcBalance error:',error); alert('⚠️ Le solde n’a pas pu être mis à jour : '+error.message); return total; }
  if(!data||!data.length){ console.warn('recalcBalance: 0 ligne mise à jour (RLS ?) pour', childId); alert('⚠️ Mission validée, mais le solde n’a pas été mis à jour (probablement une policy RLS sur profiles qui bloque l’update).'); }
  return total;
}

async function loadChildren(){
  var {data}=await client.from('profiles').select('id, display_name, star_balance').eq('family_id',S.profile.family_id).eq('role','child');
  S.children=data||[];
  S.children.forEach(function(c){ c.avatar=avatarFor(c.id); c.stars=c.star_balance||0; });
}

async function loadParentData(){
  var {data:tasks}=await client.from('tasks').select('*, task_assignees(child_id)').eq('family_id',S.profile.family_id).order('created_at');
  S.tasks=tasks||[];
  var {data:logs}=await client.from('task_logs').select('*, profiles!task_logs_child_id_fkey(display_name)').eq('family_id',S.profile.family_id).eq('status','pending').order('created_at');
  S.logs=logs||[];
  var {data:todayLogs}=await client.from('task_logs').select('task_id,child_id,status').eq('family_id',S.profile.family_id).eq('date',todayStr());
  S.todayLogs=todayLogs||[];
  var {data:pauses}=await client.from('pauses').select('*').eq('family_id',S.profile.family_id).order('from_date',{ascending:false});
  S.pauses=pauses||[];
  var {data:adjustments}=await client.from('adjustments').select('*').eq('family_id',S.profile.family_id).order('created_at',{ascending:false}).limit(30);
  S.adjustments=adjustments||[];
  var {data:badges}=await client.from('badges').select('*').eq('family_id',S.profile.family_id).order('created_at',{ascending:false}).limit(30);
  S.badges=badges||[];
  var {data:rewards}=await client.from('rewards').select('*').eq('family_id',S.profile.family_id).order('cost');
  S.rewards=rewards||[];
  var {data:redemptions}=await client.from('redemptions').select('*, profiles!redemptions_child_id_fkey(display_name)').eq('family_id',S.profile.family_id).eq('status','pending').order('created_at');
  S.redemptions=redemptions||[];
}

async function loadChildData(){
  var {data:assigned}=await client.from('task_assignees').select('task_id').eq('child_id',S.me.id);
  var assignedIds=(assigned||[]).map(function(a){return a.task_id});
  var {data:allTasks}=await client.from('tasks').select('*').eq('family_id',S.profile.family_id).eq('recurring',true);

/* ---------- séries & badges ---------- */
function appliesToList(t,cid){ return t.assign_all || (t.task_assignees||[]).some(function(a){return a.child_id===cid}); }
function isDueOn(t,dateStr){ if(t.freq==='weekly') return (t.days||[]).indexOf(dowOf(dateStr))>-1; return true; }

async function awardBadge(childId,badgeId,scope,period,reward){
  var {data:existing,error:cErr}=await client.from('badges').select('id').eq('child_id',childId).eq('badge_id',badgeId).eq('period',period);
  if(cErr){ console.error('badge check error',cErr); return; }
  if(existing&&existing.length) return;
  var {error}=await client.from('badges').insert({family_id:S.profile.family_id, child_id:childId, badge_id:badgeId, scope:scope, period:period, reward:reward, seen:false});
  if(error){ console.error('badge insert error',error); return; }
  if(reward){
    var def=badgeDef(badgeId);
    await client.from('adjustments').insert({family_id:S.profile.family_id, child_id:childId, points:reward, reason:(def?def.emoji+' '+def.name:badgeId)});
    await recalcBalance(childId);
  }
}

async function checkBadges(childId){
  var d=todayStr(), monday=mondayOf(d);
  var {data:rangeLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',monday).lte('date',d);
  var logs=rangeLogs||[];
  function ownValidated(dateStr){ return logs.filter(function(l){return l.date===dateStr}); }
  function taskOf(l){ return S.tasks.filter(function(t){return t.id===l.task_id})[0]; }
  function strictRoutineDay(dateStr){
    var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,dateStr)});
    if(!due.length) return 'none';
    var v=ownValidated(dateStr);
    return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
  }

  if(ownValidated(d).length>=1) await awardBadge(childId,'kickoff','day',d,1);
  if(strictRoutineDay(d)==='ok') await awardBadge(childId,'perfectday','day',d,1);
  if(ownValidated(d).some(function(l){var t=taskOf(l); return t&&!t.recurring})) await awardBadge(childId,'helpinghand','day',d,1);
  var morningTasks=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,d)&&t.slot==='morning'});
  if(morningTasks.length){
    var allEarly=morningTasks.every(function(t){
      var l=ownValidated(d).filter(function(x){return x.task_id===t.id})[0];
      if(!l||!l.validated_at) return false;
      var vd=new Date(l.validated_at);
      return (vd.getHours()*60+vd.getMinutes())<9*60;
    });
    if(allEarly) await awardBadge(childId,'morningpro','day',d,1);
  }

  if(dowOf(d)===1){
    var prevMonday=addDays(monday,-7);
    var {data:prevWeekLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',prevMonday).lt('date',monday);
    var pLogs=prevWeekLogs||[];
    function pOwnValidated(dateStr){ return pLogs.filter(function(l){return l.date===dateStr}); }
    function pStrictRoutineDay(dateStr){
      var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,dateStr)});
      if(!due.length) return 'none';
      var v=pOwnValidated(dateStr);
      return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
    }
    var days=weekDatesFull(prevMonday), any=false, bad=false;
    days.forEach(function(x){ var k=pStrictRoutineDay(x); if(k==='ok')any=true; else if(k==='miss')bad=true; });
    if(any&&!bad) await awardBadge(childId,'perfectweek','week',prevMonday,5);
    if(days.every(function(x){return pOwnValidated(x).length>=5})) await awardBadge(childId,'ironregular','week',prevMonday,1);
  }

  var weekDays=weekDatesUpTo(d), specialCount=0, starSum=0;
  weekDays.forEach(function(x){
    var v=ownValidated(x);
    specialCount+=v.filter(function(l){var t=taskOf(l); return t&&!t.recurring}).length;
    starSum+=v.reduce(function(s,l){return s+l.points},0);
  });
  if(specialCount>=3) await awardBadge(childId,'bonushunter','week',monday,1);
  if(starSum>=40) await awardBadge(childId,'steadyeffort','week',monday,1);
}

}

    return '<button class="'+(ui.sview===t[0]?'on':'')+'" data-a="sview" data-v="'+t[0]+'">'+t[1]+' '+t[2]+'</button>';
  }).join('')+'</div>';
  if(ui.sview==='rewards'){
    h+='<div class="sheet-inline" style="margin-bottom:16px">'+
      '<label class="lbl">Titre</label><input class="inp" data-field="rTitle" value="'+esc(ui.rTitle)+'" placeholder="Ex : Soirée pyjama">'+
      '<label class="lbl">Emoji <span class="muted" style="font-weight:600">(facultatif)</span></label><input class="inp" data-field="rEmoji" value="'+esc(ui.rEmoji)+'" placeholder="🎬" maxlength="4">'+
      '<label class="lbl">Coût en étoiles</label><input class="inp" type="number" data-field="rCost" value="'+esc(ui.rCost)+'">'+
      '<button class="btn wide" style="margin-top:14px" data-a="createReward">Créer la récompense</button></div>';
    if(!S.rewards.length) h+='<div class="empty"><div class="big">🎁</div><p>Aucune récompense créée.</p></div>';
    else h+=S.rewards.map(function(r){
      return '<div class="task"><span class="t-emoji">'+(r.emoji||'🎁')+'</span><span class="t-main"><span class="t-title">'+esc(r.title)+'</span><span class="t-meta">'+r.cost+' ⭐</span></span>'+
        '<span class="acts"><button class="ib" data-a="deleteReward" data-id="'+r.id+'" aria-label="Supprimer">🗑️</button></span></div>';
    }).join('');
  } else {
    if(!S.redemptions.length) h+='<div class="empty"><div class="big">📥</div><p>Aucune demande en attente.</p></div>';
    else h+=S.redemptions.map(function(r){
      var who=r.profiles?r.profiles.display_name:'?';
      var label=(r.emoji?r.emoji+' ':'')+r.title;
      return '<div class="task"><span class="t-emoji">'+(r.emoji||'🎁')+'</span><span class="t-main"><span class="t-title">'+esc(r.title)+'</span><span class="t-meta">'+esc(who)+' · '+r.cost+' ⭐</span></span>'+
        '<span class="acts"><button class="ib ok" data-a="decideRedemption" data-id="'+r.id+'" data-decision="given" data-cid="'+r.child_id+'" data-cost="'+r.cost+'" data-label="'+esc(label)+'" aria-label="Donner">✅</button>'+
        '<button class="ib" data-a="decideRedemption" data-id="'+r.id+'" data-decision="refused" aria-label="Refuser">❌</button></span></div>';
    }).join('');
  }
  return h;
}

function viewParent(){
  var body = ui.ptab==='today' ? pToday()
    : ui.ptab==='missions' ? pMissions()
    : ui.ptab==='shop' ? pShop()

  }

function taskCardKid(t){
  var log=S.myLogsToday.filter(function(l){return l.task_id===t.id})[0];
  var st = log ? log.status : 'todo';
  var right='',note='';
  if(st==='todo') right='<button class="btn go" data-a="doTask" data-id="'+t.id+'" data-title="'+esc(t.title)+'" data-points="'+t.points+'">C’est fait !</button>';
  else if(st==='pending') right='<span class="pill wait">⏳ À valider</span>';
  else right='<span class="pill ok">✅ Validé</span>';
  return '<div class="task '+st+'"><span class="t-emoji">🔁</span><span class="t-main"><span class="t-title">'+esc(t.title)+'</span><span class="t-meta">+'+t.points+' ⭐ · '+freqLabel(t)+'</span>'+note+'</span>'+right+'</div>';
}
function specialCardKid(t){
  var log=(S.specialLogs||[]).filter(function(l){return l.task_id===t.id&&l.child_id===S.me.id})[0];
  var takenLog=!t.assign_all?null:(S.specialLogs||[]).filter(function(l){return l.task_id===t.id&&l.child_id!==S.me.id})[0];
  var st = log ? log.status : (takenLog?'taken':'todo');
  var right='',note='';
  if(st==='todo') right='<button class="btn go" data-a="doSpecial" data-id="'+t.id+'" data-title="'+esc(t.title)+'" data-points="'+t.points+'">C’est fait !</button>';
  else if(st==='taken') right='<span class="pill">🔒 Déjà prise</span>';
  else if(st==='pending'){
    right='<span class="pill wait">⏳ À valider</span>';
    if(log.comment) note='<span class="t-comment">💬 « '+esc(log.comment)+' »</span>';
  }
  else right='<span class="pill ok">✅ Validé</span>';
  return '<div class="task '+st+'"><span class="t-emoji">✨</span><span class="t-main"><span class="t-title">'+esc(t.title)+'</span><span class="t-meta">+'+t.points+' ⭐ · '+(t.assign_all?'⚡ le premier qui la fait':'à faire par chacun')+'</span>'+note+'</span>'+right+'</div>';
}
function childMissions(){
  if(S.myPause){
    var h0='<div class="card" style="text-align:center;padding:26px 14px"><div style="font-size:44px">⏸️</div><p style="font-weight:800;margin:8px 0 0">Pause en cours'+(S.myPause.to_date?(' jusqu’au '+S.myPause.to_date):'')+'</p><p class="muted">Pas de mission pour le moment, profite !</p></div>';
    if(S.mySpecials.length) h0+='<section class="special"><div class="sp-h"><span>✨ Missions spéciales</span></div><div class="sp-sub">Toujours disponibles, même en pause.</div>'+S.mySpecials.map(specialCardKid).join('')+'</section>';
    return h0;
  }
  var due=S.tasks.filter(function(t){return isDueToday(t)});
  var total=due.length;
  var done=due.filter(function(t){var l=S.myLogsToday.filter(function(x){return x.task_id===t.id})[0]; return l&&(l.status==='pending'||l.status==='validated');}).length;
  var h='';
  if(S.mySpecials.length){
    h+='<section class="special"><div class="sp-h"><span>✨ Missions spéciales</span></div><div class="sp-sub">À faire une seule fois pour gagner des étoiles en plus.</div>'+S.mySpecials.map(specialCardKid).join('')+'</section>';
  }
  if(total){
    h+='<div class="prog"><div class="prog-h"><span>'+(done>=total?'🎉 Missions du jour terminées !':'Il te reste '+(total-done)+' mission'+(total-done>1?'s':'')+' du jour')+'</span><span>'+done+' / '+total+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div></div>';
    h+=due.map(taskCardKid).join('');
  } else if(!S.mySpecials.length){
    h+='<div class="empty"><div class="big">🌈</div><p>Pas de mission pour l’instant.<br>Profite de ta journée !</p></div>';
  }
  return h;
}

function childShop(){
  var pendingIds=(S.myRedemptions||[]).filter(function(r){return r.status==='pending'}).map(function(r){return r.reward_id});
  var h='';
  if(!S.rewards.length) h+='<div class="empty"><div class="big">🎁</div><p>Aucune récompense disponible pour l’instant.</p></div>';
  else h+=S.rewards.map(function(r){
    var isPending=pendingIds.indexOf(r.id)>-1, can=S.stars>=r.cost;
    var right=isPending?'<span class="pill wait">⏳ En attente</span>'
      :'<button class="btn go" '+(can?'':'disabled')+' data-a="requestReward" data-id="'+r.id+'" data-title="'+esc(r.title)+'" data-cost="'+r.cost+'" data-emoji="'+(r.emoji||'')+'">Demander</button>';
    return '<div class="reward"><span class="t-emoji">'+(r.emoji||'🎁')+'</span><span class="t-main"><span class="t-title">'+esc(r.title)+'</span><span class="t-meta">'+r.cost+' ⭐</span></span>'+right+'</div>';
  }).join('');
  if((S.myRedemptions||[]).length){
    h+='<div class="sec"><h3>Mes demandes</h3></div>'+S.myRedemptions.map(function(r){
      var st=r.status==='pending'?'⏳ en attente':(r.status==='given'?'✅ reçue':'❌ refusée');
      return '<div class="task"><span class="t-emoji">'+(r.emoji||'🎁')+'</span><span class="t-main"><span class="t-title">'+esc(r.title)+'</span><span class="t-meta">'+r.cost+' ⭐ · '+st+'</span></span></div>';
    }).join('');
  }
  return h;
}

function childTrophies(){
  var mine=S.myBadges||[];
  var dayCount=mine.filter(function(b){return (badgeDef(b.badge_id)||{}).scope==='day'}).length;
  var weekCount=mine.filter(function(b){return (badgeDef(b.badge_id)||{}).scope==='week'}).length;
  var h='<div class="prog"><div class="prog-h"><span>🏅 '+mine.length+' / '+BADGE_DEFS.length+' badges débloqués</span></div>'+
    '<div class="chips" style="margin:0"><span class="stat">📅 '+dayCount+'</span><span class="stat">🗓️ '+weekCount+'</span></div></div>';
  h+=BADGE_DEFS.map(function(def){
    var got=mine.filter(function(b){return b.badge_id===def.id});
    var unlocked=got.length>0;
    return '<div class="task '+(unlocked?'done':'')+'" style="opacity:'+(unlocked?1:.55)+'"><span class="t-emoji">'+(unlocked?def.emoji:'🔒')+'</span>'+
      '<span class="t-main"><span class="t-title">'+esc(def.name)+(got.length>1?' ×'+got.length:'')+'</span><span class="t-meta">'+esc(def.desc)+'</span></span>'+
      '<span class="pill '+(unlocked?'ok':'')+'">+'+def.reward+' ⭐</span></div>';
  }).join('');
  return h;
}

function viewChild(){
  var body = ui.tab==='missions' ? childMissions()
    : ui.tab==='shop' ? childShop()
    : childTrophies();
  return '<header class="top"><span></span><button class="ghost-link" data-a="logout">Déconnexion</button></header>'+
    '<section class="hero"><div class="hero-av">'+avatarFor(S.me.id)+'</div><div class="hero-main">'+
    '<div class="hero-name">Salut '+esc(S.profile.display_name)+' !</div>'+
    '<div class="chips"><span class="stat">⭐ '+S.stars+'</span></div></div></section>'+body;
}

/* ---------- rendu ---------- */
function render(){
  var h='',nav='';
  if(ui.view==='loading') h='<div class="empty" style="padding-top:80px"><div class="big">🏡</div><p>Chargement...</p></div>';
  else if(ui.view==='entry') h=viewEntry();
  else if(ui.view==='parentlogin') h=viewParentLogin();
  else if(ui.view==='kidlogin') h=viewKidLogin();
  else if(ui.view==='parent'){ h=viewParent(); nav=parentNav(); }
  else if(ui.view==='child'){ h=viewChild(); nav=childNav(); }
  var app=document.getElementById('app');
  app.className = nav ? '' : 'nonav';
  app.innerHTML = h+nav;
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.classList.remove('show')},2600);
}

/* ---------- actions ---------- */
var A={
  goEntry:function(){ ui.view='entry'; ui.loginErr=null; render(); },
  toKidLogin:function(){ ui.view='kidlogin'; ui.loginErr=null; render(); },
  toParentLogin:function(){ ui.view='parentlogin'; ui.loginErr=null; render(); },
  doParentLogin:async function(){
    var email=(document.querySelector('[data-field="pemail"]')||{}).value||'';
    var pass=(document.querySelector('[data-field="ppass"]')||{}).value||'';
    email=email.trim();
    if(!email||!pass){ ui.loginErr='Indique ton e-mail et ton mot de passe.'; render(); return; }
    ui.loginBusy=true; ui.loginErr=null; render();
    var {error}=await client.auth.signInWithPassword({email:email,password:pass});
    if(error){ ui.loginBusy=false; ui.loginErr=error.message; render(); return; }
    await afterLogin();
  },
  doChildPair:async function(){
    var code=((document.querySelector('[data-field="code"]')||{}).value||'').trim().toUpperCase();
    if(!code){ ui.loginErr='Entre ton code.'; render(); return; }
    ui.loginBusy=true; ui.loginErr=null; render();
    try{
      var res=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'redeem',code:code})});
      var out=await res.json();
      if(!res.ok){ ui.loginBusy=false; ui.loginErr=out.error||res.statusText; render(); return; }
      var {error}=await client.auth.verifyOtp({token_hash:out.token_hash,type:'magiclink'});
      if(error){ ui.loginBusy=false; ui.loginErr=error.message; render(); return; }
      await afterLogin();
    }catch(e){
      ui.loginBusy=false; ui.loginErr='Erreur technique : '+e.message; render();
    }
  },
  logout:async function(){ await client.auth.signOut(); location.reload(); },
  ptab:function(d){ ui.ptab=d.t; ui.expandChild=null; ui.newOpen=false; render(); },
  tab:function(d){ ui.tab=d.t; render(); },

  toggleChild:function(d){ ui.expandChild = ui.expandChild===d.id ? null : d.id; render(); },
  validate:async function(d){
    var {error}=await client.from('task_logs').update({status:'validated', validated_at:new Date().toISOString(), comment:null}).eq('id',d.id);
    if(error){ alert('❌ '+error.message); return; }
    await recalcBalance(d.cid);
    await checkBadges(d.cid);
    toast('✅ Mission validée');
    await refreshParentScreen();
  },

  mview:function(d){ ui.mview=d.v; ui.newOpen=false; ui.formErr=null; render(); },
  openNew:function(){ ui.newOpen=true; ui.newFreq='daily'; ui.newSlot='none'; ui.newAssignAll=false; ui.newPicked=[]; ui.newDays=[]; ui.newSMode='race'; ui.newSPicked=[]; ui.formErr=null; ui.newTitle=''; ui.newPoints='5'; ui.newSTitle=''; ui.newSPoints='10'; render(); },
  closeForm:function(){ ui.newOpen=false; render(); },
  setFreq:function(d){ ui.newFreq=d.v; render(); },
  toggleDay:function(d){ var v=+d.v,i=ui.newDays.indexOf(v); if(i>-1)ui.newDays.splice(i,1); else ui.newDays.push(v); render(); },
  setSlot:function(d){ ui.newSlot=d.v; render(); },
  toggleAssignAll:function(){ ui.newAssignAll=!ui.newAssignAll; if(ui.newAssignAll) ui.newPicked=[]; render(); },
  togglePick:function(d){ var i=ui.newPicked.indexOf(d.v); if(i>-1)ui.newPicked.splice(i,1); else ui.newPicked.push(d.v); if(ui.newPicked.length) ui.newAssignAll=false; render(); },
  setSMode:function(d){ ui.newSMode=d.v; render(); },
  toggleSPick:function(d){ var i=ui.newSPicked.indexOf(d.v); if(i>-1)ui.newSPicked.splice(i,1); else ui.newSPicked.push(d.v); render(); },

  createRecurring:async function(){
    var title=(ui.newTitle||'').trim();
    var points=parseInt(ui.newPoints,10)||5;
    if(!title){ ui.formErr='Un titre est nécessaire.'; render(); return; }
    if(ui.newFreq==='weekly' && !ui.newDays.length){ ui.formErr='Choisissez au moins un jour de la semaine.'; render(); return; }
    var {data:task,error}=await client.from('tasks').insert({
      family_id:S.profile.family_id, title:title, points:points, recurring:true,
      assign_all:ui.newAssignAll, freq:ui.newFreq, days:ui.newFreq==='weekly'?ui.newDays:null, slot:ui.newSlot, created_by:S.me.id
    }).select().single();
    if(error){ ui.formErr=error.message; render(); return; }
    if(!ui.newAssignAll && ui.newPicked.length){
      var {error:aerr}=await client.from('task_assignees').insert(ui.newPicked.map(function(cid){return {task_id:task.id, child_id:cid, family_id:S.profile.family_id}}));
      if(aerr){ ui.formErr=aerr.message; render(); return; }
    }
    ui.newOpen=false; toast('✅ Mission créée');
    await loadParentData(); render();
  },
  createSpecial:async function(){
    var title=(ui.newSTitle||'').trim();
    var points=parseInt(ui.newSPoints,10)||10;
    if(!title){ ui.formErr='Un titre est nécessaire.'; render(); return; }
    if(ui.newSMode==='each' && !ui.newSPicked.length){ ui.formErr='Choisissez au moins un enfant.'; render(); return; }
    var {data:task,error}=await client.from('tasks').insert({
      family_id:S.profile.family_id, title:title, points:points, recurring:false,
      assign_all:ui.newSMode==='race', created_by:S.me.id
    }).select().single();
    if(error){ ui.formErr=error.message; render(); return; }

      var {error:aerr}=await client.from('task_assignees').insert(ui.newSPicked.map(function(cid){return {task_id:task.id, child_id:cid, family_id:S.profile.family_id}}));
      if(aerr){ ui.formErr=aerr.message; render(); return; }
    }
    ui.newOpen=false; toast('✅ Mission spéciale créée');
    await loadParentData(); render();
  },
  delTask:async function(d){
    if(!confirm('Supprimer cette mission ?')) return;
    var {error}=await client.from('tasks').delete().eq('id',d.id);
    if(error){ alert('❌ '+error.message); return; }
    await loadParentData(); render();
  },

  doTask:async function(d){
    var {error}=await client.from('task_logs').insert({
      family_id:S.profile.family_id, task_id:d.id, child_id:S.me.id, title:d.title, points:+d.points, status:'pending', date:todayStr()
    });
    if(error){ alert('❌ '+error.message); return; }
    toast('⏳ Envoyé à tes parents pour validation');
    await refreshChildScreen();
  },
  doSpecial:async function(d){
    var comment=prompt('Un petit mot pour tes parents ? (facultatif)')||null;
    var {error}=await client.from('task_logs').insert({
      family_id:S.profile.family_id, task_id:d.id, child_id:S.me.id, title:d.title, points:+d.points, status:'pending', date:todayStr(), comment:comment
    });
    if(error){ alert('❌ '+error.message); return; }
    toast('⏳ Envoyé à tes parents pour validation');
    await refreshChildScreen();
  },

  fview:function(d){ ui.fview=d.v; render(); },
  sview:function(d){ ui.sview=d.v; render(); },

  /* pauses */
  setPauseChild:function(d){ ui.pauseChild=d.v; render(); },
  createPause:async function(){
    if(!ui.pauseFrom){ toast('❌ Date de début nécessaire'); return; }
    if(ui.pauseTo && ui.pauseTo<ui.pauseFrom){ toast('❌ La date de fin doit être après le début'); return; }
    var {error}=await client.from('pauses').insert({family_id:S.profile.family_id, child_id:ui.pauseChild||null, from_date:ui.pauseFrom, to_date:ui.pauseTo||null});
    if(error){ alert('❌ '+error.message); return; }
    ui.pauseTo=''; toast('✅ Pause enregistrée');
    await loadParentData(); render();
  },
  endPause:async function(d){
    if(!confirm('Terminer cette pause maintenant ?')) return;
    var {data,error}=await client.from('pauses').update({to_date:addDays(todayStr(),-1)}).eq('id',d.id).select();
    if(error){ alert('❌ '+error.message); return; }
    if(!data||!data.length){ alert('⚠️ La pause n’a pas été modifiée (probablement une policy RLS UPDATE manquante sur la table pauses).'); return; }

  /* ajustements */
  setAdjChild:function(d){ ui.adjChild=d.v; render(); },

    var points=parseInt(ui.adjPoints,10);
    if(!ui.adjChild){ toast('❌ Choisis un enfant'); return; }
    if(!points){ toast('❌ Indique un nombre d’étoiles (positif ou négatif)'); return; }
    var {error}=await client.from('adjustments').insert({family_id:S.profile.family_id, child_id:ui.adjChild, points:points, reason:(ui.adjReason||'').trim()||null});

    await client.from('adjustments').delete().eq('id',d.id);
    await recalcBalance(d.cid);
    await refreshParentScreen();
  },

  /* récompenses (parent) */

    var title=(ui.rTitle||'').trim(), cost=parseInt(ui.rCost,10);
    if(!title){ toast('❌ Un titre est nécessaire'); return; }
    if(!cost||cost<1){ toast('❌ Indique un coût en étoiles'); return; }
    var {error}=await client.from('rewards').insert({family_id:S.profile.family_id, title:title, emoji:(ui.rEmoji||'').trim()||null, cost:cost});

    await client.from('rewards').delete().eq('id',d.id);
    await loadParentData(); render();

  decideRedemption:async function(d){
    var {error}=await client.from('redemptions').update({status:d.decision, decided_at:new Date().toISOString()}).eq('id',d.id);
    if(error){ alert('❌ '+error.message); return; }
    if(d.decision==='given'){
      await client.from('adjustments').insert({family_id:S.profile.family_id, child_id:d.cid, points:-parseInt(d.cost,10), reason:'🎁 '+d.label});
      await recalcBalance(d.cid);

    toast(d.decision==='given'?'🎁 Récompense donnée':'Demande refusée');
    await refreshParentScreen();
  },

  /* récompenses (enfant) */
  requestReward:async function(d, btn){
    if(btn){ btn.disabled=true; btn.textContent='...'; }
    if(S.stars<+d.cost){ alert('Pas assez d’étoiles pour cette récompense.'); if(btn){btn.disabled=false; btn.textContent='Demander';} return; }
    var already=(S.myRedemptions||[]).some(function(r){return r.reward_id===d.id&&r.status==='pending'});
    if(already){ await refreshChildScreen(); return; }
    var {error}=await client.from('redemptions').insert({family_id:S.profile.family_id, child_id:S.me.id, reward_id:d.id, title:d.title, emoji:d.emoji||null, cost:+d.cost, status:'pending'});
    if(error){ alert('❌ '+error.message); return; }
    toast('🎁 Demande envoyée !');
    await refreshChildScreen();

};

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el)return;
  var fn=A[el.getAttribute('data-a')];
  if(fn)fn(el.dataset, el);
});
document.addEventListener('input',function(e){
  var el=e.target, f=el.dataset && el.dataset.field;
  if(!f) return;
  if(f==='ntitle') ui.newTitle=el.value;
  else if(f==='npoints') ui.newPoints=el.value;
  else if(f==='stitle') ui.newSTitle=el.value;
  else if(f==='spoints') ui.newSPoints=el.value;
  else if(f==='pauseFrom') ui.pauseFrom=el.value;
  else if(f==='pauseTo') ui.pauseTo=el.value;
  else if(f==='pauseChild') ui.pauseChild=el.value;
  else if(f==='adjChild') ui.adjChild=el.value;
  else if(f==='adjPoints') ui.adjPoints=el.value;
  else if(f==='adjReason') ui.adjReason=el.value;
  else if(f==='rTitle') ui.rTitle=el.value;
  else if(f==='rEmoji') ui.rEmoji=el.value;
  else if(f==='rCost') ui.rCost=el.value;
});
document.addEventListener('change',function(e){
  var el=e.target, f=el.dataset && el.dataset.field;
  if(!f || el.tagName!=='SELECT') return;
  if(f==='pauseChild') ui.pauseChild=el.value;
  else if(f==='adjChild') ui.adjChild=el.value;
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(ui.view==='parentlogin') A.doParentLogin();
  else if(ui.view==='kidlogin') A.doChildPair();
});

boot();
})();
</script>
</body>
</html>
