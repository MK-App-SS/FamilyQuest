<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem('mf_theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<meta name="theme-color" content="#fff9ef">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fff9ef;--card:#ffffff;--ink:#17233c;--muted:#7b7890;
  --pri:#ff6b5e;--pri-d:#e8564a;--pri-ink:#ffffff;--pri-soft:#fff0ee;
  --acc:#ffd166;--ok:#1fae6b;--ok-soft:#dff6ea;--bad:#e5484d;
  --warn-soft:#fff3d6;--line:#ede5d8;--shadow:0 8px 24px rgba(23,35,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a2e;--card:#1e2640;--ink:#f4f1ec;--muted:#a1a9c4;
    --pri:#ff6b5e;--pri-d:#e8564a;--pri-ink:#ffffff;--pri-soft:#33283a;
    --acc:#ffd166;--ok:#3ed08e;--ok-soft:#173a2f;--bad:#ff6b70;
    --warn-soft:#3b3218;--line:#2e3858;--shadow:0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#141a2e;--card:#1e2640;--ink:#f4f1ec;--muted:#a1a9c4;
  --pri:#ff6b5e;--pri-d:#e8564a;--pri-ink:#ffffff;--pri-soft:#33283a;
  --acc:#ffd166;--ok:#3ed08e;--ok-soft:#173a2f;--bad:#ff6b70;
  --warn-soft:#3b3218;--line:#2e3858;--shadow:0 8px 24px rgba(0,0,0,.4);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.logo,.hero-name,.t-title,.who-name,.brand{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{max-width:540px;margin:0 auto;padding:14px 16px 110px}
#app.nonav{padding-bottom:40px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:44px}
.logo{font-weight:800;font-size:22px}
.hello{font-size:30px;font-weight:800;margin:12px 0 8px;line-height:1.15}
.muted{color:var(--muted)}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:13px}

.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;background:var(--pri);color:var(--pri-ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--pri-d);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.go{background:var(--ok);box-shadow:0 4px 0 rgba(0,0,0,.18);color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px;min-height:36px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.ghost:active{transform:none;background:var(--pri-soft)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ghost-link{background:none;border:0;color:var(--muted);font-weight:800;font-size:15px;padding:10px 6px;cursor:pointer;min-height:44px}
.lnk{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}

/* entrée */
.entry{text-align:center;padding-top:16px}
.entry-logo{font-size:64px;line-height:1}
.brand{font-size:36px;font-weight:800;margin-top:6px}
.tag{color:var(--muted);font-weight:700;margin:6px 0 26px}
.bigbtn{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.bigbtn:active{transform:scale(.97)}
.bigbtn span{grid-row:1/3;font-size:44px;background:var(--pri-soft);width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.bigbtn b{font-family:'Baloo 2',sans-serif;font-size:22px;line-height:1.1;align-self:end}
.bigbtn small{color:var(--muted);font-weight:700;font-size:14px;align-self:start}

.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.who{border:0;background:var(--card);border-radius:24px;padding:22px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s}
.av{font-size:58px;line-height:1;background:var(--pri-soft);width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.av.sm{width:56px;height:56px;font-size:32px;flex:none}
.who-name{font-size:22px;font-weight:800;margin-top:6px}
.who-sub{font-size:13px;color:var(--muted);font-weight:700}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:800;min-width:18px;text-align:center;line-height:18px}

/* héros enfant */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.hero-av{font-size:50px;background:var(--pri-soft);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero-main{flex:1;min-width:0}
.hero-name{font-size:25px;font-weight:800;line-height:1.1}
.hero-lvl{font-weight:800;color:var(--pri);font-size:14px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 14px}
.stat{background:var(--warn-soft);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}

.switch{width:54px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;padding:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--pri)}
.switch.on::after{transform:translateX(22px)}
.theme-btn{font-size:20px;padding:6px 10px}
.long-hint{font-size:12px;color:var(--muted);text-align:center;margin:0 0 10px;font-weight:700;white-space:nowrap}
.acc-card{margin-bottom:10px}
.acc-card.open{border:2px solid var(--ok);background:var(--ok-soft)}
.acc-line{font-size:14px;font-weight:700;margin-top:6px;padding-left:2px}
.acc-line.ok{color:var(--muted);text-decoration:line-through}
.acard{padding:0;margin-bottom:12px;overflow:hidden}
.acard.off{opacity:.6}
.acard-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.acc-child{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.cond-card{background:var(--pri-soft);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.cond-tag{font-weight:900;font-size:12px;background:var(--pri);color:#fff;border-radius:8px;padding:4px 8px;flex:none}
.vig-op{display:block;width:100%;text-align:left;background:var(--pri-soft);border:2px solid transparent;border-radius:14px;padding:10px 12px;margin-bottom:6px;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.vig-op.sel{border-color:var(--pri);background:var(--card)}
.vig-pt{background:var(--acc);color:#17233c;border-radius:6px;padding:0 4px}
.vig-tip{color:#b7791f;font-weight:700}
.ast-mascot.is3d{width:64px;height:64px}
.ast-mascot.is3d .ast-body{animation:none!important;filter:none}
.mv-slot{position:relative;width:100%;height:100%;display:grid;place-items:center}
.mv-slot.on>.ico-img{display:none}
.mv-slot model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent;pointer-events:none}
.cel-mascot.is3d{width:160px;height:160px}
.cel-mascot.is3d .cel-mbody{animation:none!important}
.hero-name{display:flex;align-items:center;flex-wrap:wrap;gap:0 4px}
.acc-row{display:inline-flex;gap:4px;align-items:center;vertical-align:middle;margin-left:6px}
.acc-link{display:inline-flex;cursor:pointer}
.acc-ico{display:inline-grid;place-items:center;border-radius:50%;background:var(--pri-soft);filter:grayscale(1);opacity:.42;transition:filter .3s,opacity .3s,background .3s;flex:none;overflow:hidden}
.acc-ico .ico-img{width:78%;height:78%}
.acc-ico .ico-img.ico-photo{width:100%;height:100%}
.acc-ico.on{filter:none;opacity:1;background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ktask.sp .t-title{font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.ktask.sp .t-meta{font-size:12px}
.ktask.sp .t-rule{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px;line-height:1.25}
.ktask.sp .btn.go{padding:10px 14px;font-size:15px;min-height:44px}
.ktask.sp .t-main{min-width:0}
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pet-opt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--pri-soft);border:3px solid transparent;border-radius:18px;padding:8px 4px;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .12s}
.pet-opt:active{transform:scale(.95)}
.pet-opt.sel{border-color:var(--pri);background:var(--card);transform:scale(1.04)}
.pet-img{width:52px;height:52px;display:grid;place-items:center}
.pet-img .ico-img{width:100%;height:100%}
.pet-name{font-size:12px;font-weight:800}
/* assistant */
.ast{position:relative;display:flex;gap:10px;align-items:center;margin:0 0 12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px 38px 8px 8px;box-shadow:var(--shadow);animation:astPop .4s cubic-bezier(.2,1.3,.4,1) both}
.ast-mascot{position:relative;width:52px;height:52px;flex:none;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ast-mascot::after{content:'';position:absolute;left:16%;bottom:-3px;width:68%;height:9px;border-radius:50%;background:rgba(0,0,0,.16);filter:blur(2px);animation:astShadow 5s ease-in-out infinite}
.ast-body{position:absolute;inset:0;display:grid;place-items:center;transform-origin:50% 90%;animation:astIdle 5s ease-in-out infinite}
.ast-body .ico-img{width:100%;height:100%}
.ast-badge{position:absolute;top:-6px;right:-4px;font-size:22px;line-height:1;animation:astBadge 1.4s ease-in-out infinite;pointer-events:none}
.m-happy .ast-body{animation:astHappy 3s ease-in-out infinite}
.m-excited .ast-body{animation:astExcited 2.2s ease-in-out infinite}
.m-surprise .ast-body{animation:astSurprise .6s ease-out,astIdle 5s ease-in-out .6s infinite}
.m-wave .ast-body{animation:astWave 1.6s ease-in-out 1,astIdle 5s ease-in-out 1.6s infinite}
.m-sleepy .ast-body{animation:astSleepy 4s ease-in-out infinite;filter:saturate(.8) brightness(.92)}
.m-sleepy::after{animation:astShadow 4s ease-in-out infinite}
.m-sleepy .ast-badge{animation:astZzz 2.4s ease-in-out infinite}
.fx-jump .ast-body{animation:astJump .65s cubic-bezier(.3,1.4,.5,1)!important}
.fx-hop .ast-body{animation:astHop .5s ease-out!important}
.fx-spin .ast-body{animation:astSpin .8s ease-in-out!important}
.fx-wiggle .ast-body{animation:astWiggle .7s ease-in-out!important}
.ast-p{position:absolute;left:50%;top:40%;font-size:18px;pointer-events:none;z-index:5;animation:astP 1s ease-out forwards}
.ast-bubble{position:static;flex:1;min-width:0;padding:0}
.ast-cta{display:inline-block;margin-top:6px;border:0;border-radius:999px;background:var(--pri-soft);color:var(--pri);font:inherit;font-weight:800;font-size:12.5px;padding:3px 11px;cursor:pointer}
.ast-cta:active{transform:scale(.95)}
.hero.wx{position:relative;overflow:hidden;padding-top:34px;background:var(--wxbg);color:var(--wxink)}
.hero.wx>*:not(.wx-fx):not(.wx-chip){position:relative;z-index:1}
.hero.wx .hero-lvl,.hero.wx .muted{color:var(--wxsoft)}
.wx.wx-dk{--wxink:#fff;--wxsoft:#dbe4ff;--cl:rgba(255,255,255,.28)}
.wx.wx-lt{--wxink:#1f2a44;--wxsoft:#2f5aa8;--cl:rgba(255,255,255,.8)}
.wx-clear{--wxbg:linear-gradient(135deg,#8fd0ff,#fff1b8)}
.wx-partly{--wxbg:linear-gradient(135deg,#9fd0f2,#e8f2fb)}
.wx-cloudy{--wxbg:linear-gradient(135deg,#bcc8d6,#e6ebf1)}
.wx-fog{--wxbg:linear-gradient(135deg,#c5cdd4,#eceff1)}
.wx-rain{--wxbg:linear-gradient(135deg,#55738f,#8aa4bc)}
.wx-snow{--wxbg:linear-gradient(135deg,#9db3cc,#dce8f4)}
.wx-storm{--wxbg:linear-gradient(135deg,#363b51,#656b88)}
.wx-night{--wxbg:linear-gradient(135deg,#17204a,#3a3f78)}
.wx-chip{position:absolute!important;top:8px;right:10px;z-index:3;display:flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:4px 10px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.88);color:#1f2a44;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.wx-chip:active{transform:scale(.95)}
.wx-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;z-index:0}
.wx-sun{position:absolute;top:-34px;right:-24px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fffbc8 0 32%,rgba(255,236,140,.6) 33% 58%,rgba(255,236,140,0) 72%);animation:wxPulse 6s ease-in-out infinite}
.wx-moon{position:absolute;top:14px;right:74px;width:34px;height:34px;border-radius:50%;box-shadow:11px 4px 0 0 #f6f1d5;animation:wxPulse 7s ease-in-out infinite}
.wx-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:wxTwinkle 3s ease-in-out infinite}
.wx-cloud{position:absolute;height:24px;border-radius:30px;background:var(--cl);animation:wxDrift linear infinite}
.wx-cloud::before{content:"";position:absolute;width:32px;height:32px;border-radius:50%;background:inherit;top:-14px;left:16px}
.wx-cloud::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:inherit;top:-8px;left:40px}
.wx-drop{position:absolute;top:-16px;width:2px;height:14px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(12deg);animation:wxFall linear infinite}
.wx-flake{position:absolute;top:-8px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;animation:wxSnow linear infinite}
.wx-band{position:absolute;left:-40%;width:180%;height:26px;border-radius:20px;background:rgba(255,255,255,.5);filter:blur(7px);animation:wxFog ease-in-out infinite alternate}
.wx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:wxFlash 6s infinite}
@keyframes wxPulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.08);opacity:1}}
@keyframes wxTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes wxDrift{from{transform:translateX(-140px)}to{transform:translateX(460px)}}
@keyframes wxFall{to{transform:translate(-16px,190px) rotate(12deg)}}
@keyframes wxSnow{0%{transform:translate(0,0)}50%{transform:translate(14px,90px)}100%{transform:translate(-8px,190px)}}
@keyframes wxFog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes wxFlash{0%,91%,100%{opacity:0}92%{opacity:.55}94%{opacity:0}96%{opacity:.4}98%{opacity:0}}
@media(prefers-reduced-motion:reduce){.wx-fx *{animation:none!important}.wx-flash{display:none}}
.wx-now{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.wx-now .wx-big{font-size:54px;line-height:1}
.wx-now b{font-family:'Baloo 2','Nunito',sans-serif;font-size:38px;line-height:1}
.wx-hours{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.wx-h{flex:none;min-width:58px;text-align:center;background:var(--card);border-radius:14px;padding:8px 6px;box-shadow:var(--shadow);font-weight:800;font-size:13px}
.wx-h span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.wx-tip{background:var(--pri-soft);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ktask .t-rule{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.stat-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);border-radius:20px;padding:14px 12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--shadow);border-left:6px solid var(--c);transition:transform .12s}
.stat-btn:active{transform:scale(.97)}
@supports (background:color-mix(in srgb,red 10%,white)){.stat-btn{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,var(--card)),var(--card) 80%);border-color:color-mix(in srgb,var(--c) 40%,transparent);border-left-color:var(--c)}}
.stat-btn .sb-i{font-size:28px;line-height:1}
.stat-btn .sb-t{font-weight:800;font-size:15px;line-height:1.2;margin-top:4px}
.stat-btn .sb-s{font-size:12px;font-weight:700;color:var(--muted)}
.stat-tile{background:var(--card);border-radius:16px;padding:12px 8px;box-shadow:var(--shadow);text-align:center}
.stat-tile b{display:block;font-family:'Baloo 2','Nunito',sans-serif;font-size:24px;line-height:1.1}
.stat-tile span{font-size:12px;color:var(--muted);font-weight:700}
.chart-card{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-top:10px}
.chart-card h4{margin:0 0 6px;font-size:14px}
.chart-card svg{width:100%;height:auto;display:block}
.chart-card text{fill:var(--muted);font-size:9px;font-weight:700;font-family:inherit}
.top-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.top-row:last-child{border-bottom:0}
.ast-name{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--pri)}
.ast-text{font-weight:700;font-size:14px;line-height:1.35;transition:opacity .2s}
.ast-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--muted);font-weight:800;cursor:pointer;line-height:1;padding:0}
@keyframes astIdle{0%,100%{transform:translateY(0) rotate(0) scale(1,1)}12%{transform:translateY(-4px) rotate(-2deg) scale(1,1)}24%{transform:translateY(0) rotate(0) scale(1,1)}46%{transform:scale(1.03,.95)}50%{transform:scale(1,1)}68%{transform:translateY(-3px) rotate(3deg)}84%{transform:translateY(0) rotate(0)}}
@keyframes astShadow{0%,100%{transform:scaleX(1);opacity:1}12%{transform:scaleX(.88);opacity:.8}68%{transform:scaleX(.9);opacity:.85}}
@keyframes astHappy{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-2deg) scale(1.02)}}
@keyframes astExcited{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(1.02)}}
@keyframes astShadowJump{0%,100%{transform:scaleX(1.05);opacity:1}50%{transform:scaleX(.6);opacity:.55}}
@keyframes astSurprise{0%{transform:scale(1)}45%{transform:scale(1.12) translateY(-3px)}100%{transform:scale(1)}}
@keyframes astWave{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
@keyframes astSleepy{0%,100%{transform:rotate(-6deg) translateY(2px) scale(1,.97)}50%{transform:rotate(4deg) translateY(0) scale(1,1.01)}}
@keyframes astBadge{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.12)}}
@keyframes astZzz{0%{opacity:0;transform:translate(0,6px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-16px) scale(1.15)}}
@keyframes astJump{0%{transform:scale(1.1,.85)}40%{transform:translateY(-26px) scale(.92,1.1)}70%{transform:translateY(0) scale(1.1,.88)}100%{transform:none}}
@keyframes astHop{0%{transform:none}40%{transform:translateY(-8px) scale(.98,1.03)}100%{transform:none}}

function resizeToSquare(file,size){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var m=Math.min(img.width,img.height), sx=(img.width-m)/2, sy=(img.height-m)/2;
      var c=document.createElement('canvas'); c.width=c.height=size;
      c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,size,size);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?res(b):rej(new Error('Conversion impossible')); },'image/jpeg',0.85);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    img.src=url;
  });
}

// Renvoie le solde dépensable (balance) et le total d'étoiles gagnées (earned, sert au niveau : ne baisse jamais).
async function computeTotals(childId){
  var v=(await client.from('task_logs').select('points').eq('child_id',childId).eq('status','validated')).data||[];
  var s=(await client.from('task_shares').select('points').eq('child_id',childId)).data||[];
  var a=(await client.from('adjustments').select('points').eq('child_id',childId)).data||[];
  var sum=function(arr,f){ return arr.reduce(function(t,l){return t+(f?f(l):l.points)},0); };
  var pos=function(l){return l.points>0?l.points:0};
  return {balance:sum(v)+sum(s)+sum(a), earned:sum(v,pos)+sum(s,pos)+sum(a,pos)};
}
async function computeStars(childId){ return (await computeTotals(childId)).balance; }

// Recalcule le solde réel d'un enfant depuis les tables sources et le réécrit dans profiles.star_balance.
// À appeler après toute action qui change ses étoiles (validation, partage, ajustement, récompense donnée...).
async function recalcBalance(childId){
  var tt=await computeTotals(childId), total=tt.balance;
  var {data,error}=await client.from('profiles').update({star_balance:total, total_earned:tt.earned}).eq('id',childId).select();
  if(error){ console.error('recalcBalance error:',error); showAlert('⚠️ Le solde n’a pas pu être mis à jour : '+error.message); return total; }
  if(!data||!data.length){ console.warn('recalcBalance: 0 ligne mise à jour (RLS ?) pour', childId); showAlert('⚠️ Mission validée, mais le solde n’a pas été mis à jour (probablement une policy RLS sur profiles qui bloque l’update).'); }
  return total;
}

// Série en cours = nombre de jours consécutifs avec le badge "journée parfaite", en remontant depuis
// aujourd'hui (ou hier si la journée n'est pas encore terminée côté enfant).
async function computeStreak(childId){
  var {data}=await client.from('badges').select('period').eq('child_id',childId).eq('badge_id','perfectday');
  var set={}; (data||[]).forEach(function(b){ set[b.period]=true; });
  var d=todayStr();
  if(!set[d]) d=addDays(d,-1);
  var streak=0;
  while(set[d]){ streak++; d=addDays(d,-1); }
  return streak;
}

async function loadChildDetail(childId){
  var d=todayStr(), weekStart=addDays(d,-6);
  var {data:weekLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',weekStart).lte('date',d);
  var wl=weekLogs||[];
  var days=[], weekDue=0, weekDone=0;
  for(var i=6;i>=0;i--){
    var day=addDays(d,-i);
    var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,day)&&(!t.created_at||t.created_at.slice(0,10)<=day)});
    var dayLogs=wl.filter(function(l){return l.date===day});
    var paused=S.pauses.some(function(p){return (p.child_id===childId||!p.child_id)&&p.from_date<=day&&(!p.to_date||p.to_date>=day)});
    var complete=due.length>0 && due.every(function(t){return dayLogs.some(function(l){return l.task_id===t.id})});
    var status;
    if(paused) status='paused';
    else if(complete) status='ok';
    else if(day===d) status='today';
    else if(!due.length) status='none';
    else status='miss';
    days.push({date:day, dow:dowOf(day), status:status});
    if(!paused){
      due.forEach(function(t){
        weekDue++;
        if(dayLogs.some(function(l){return l.task_id===t.id})) weekDone++;
      });
    }
  }
  // Missions spéciales (ponctuelles) : comptées une seule fois chacune, pas par jour.
  // Les missions "premier arrivé" (assign_all) sont exclues : personne n'en est individuellement
  // responsable, donc ça ne doit ni aider ni pénaliser le taux de réussite d'un enfant en particulier.
  var mySpecials=S.tasks.filter(function(t){return !t.recurring && !t.assign_all && appliesToList(t,childId)});
  var specialValidated={};
  if(mySpecials.length){
    var {data:svLogs}=await client.from('task_logs').select('task_id,date').eq('child_id',childId).eq('status','validated').in('task_id',mySpecials.map(function(t){return t.id}));
    (svLogs||[]).forEach(function(l){ specialValidated[l.task_id]=l.date; });
  }
  // Spéciales créées dans les 7 derniers jours → comptent dans le taux de la semaine.
  mySpecials.forEach(function(t){
    var createdDate=t.created_at?t.created_at.slice(0,10):null;
    if(createdDate && createdDate>=weekStart && createdDate<=d){
      weekDue++;
      var vDate=specialValidated[t.id];
      if(vDate && vDate>=weekStart && vDate<=d) weekDone++;
    }
  });
  var weekRate=weekDue>0?Math.round(weekDone/weekDue*100):null;

  var {data:allPerfect}=await client.from('badges').select('period').eq('child_id',childId).eq('badge_id','perfectday').order('period');
  var periods=(allPerfect||[]).map(function(b){return b.period});
  var longest=0,run=0,prev=null;
  periods.forEach(function(p){ run=(prev&&addDays(prev,1)===p)?run+1:1; longest=Math.max(longest,run); prev=p; });

  // Taux de réussite global (sur les missions, pas les journées) : parmi toutes les missions récurrentes
  // dues depuis la toute première mission validée de l'enfant, + toutes les missions spéciales qui lui
  // ont été proposées, combien ont été effectivement validées.
  var {data:firstLog}=await client.from('task_logs').select('date').eq('child_id',childId).eq('status','validated').order('date',{ascending:true}).limit(1);
  var successRate=null;
  if(firstLog&&firstLog.length){
    var start=firstLog[0].date;
    var {data:histLogs}=await client.from('task_logs').select('task_id,date').eq('child_id',childId).eq('status','validated').gte('date',start).lte('date',d);
    var validatedSet={};
    (histLogs||[]).forEach(function(l){ validatedSet[l.date+'|'+l.task_id]=true; });
    var totalDue=0, totalDone=0, cursor=start;
    while(cursor<=d){
      var pausedThatDay=S.pauses.some(function(p){return (p.child_id===childId||!p.child_id)&&p.from_date<=cursor&&(!p.to_date||p.to_date>=cursor)});
      if(!pausedThatDay){
        var dueThatDay=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,cursor)&&(!t.created_at||t.created_at.slice(0,10)<=cursor)});
        dueThatDay.forEach(function(t){
          totalDue++;
          if(validatedSet[cursor+'|'+t.id]) totalDone++;
        });
      }
      cursor=addDays(cursor,1);
    }
    mySpecials.forEach(function(t){
      totalDue++;
      if(specialValidated[t.id]) totalDone++;
    });
    successRate=totalDue>0?Math.round(totalDone/totalDue*100):null;
  }

  var {data:allValidated}=await client.from('task_logs').select('points').eq('child_id',childId).eq('status','validated');
  var {data:allShares}=await client.from('task_shares').select('points').eq('child_id',childId);
  var {data:allAdj}=await client.from('adjustments').select('points').eq('child_id',childId);
  var earned=(allValidated||[]).reduce(function(s,l){return s+l.points},0)+(allShares||[]).reduce(function(s,l){return s+l.points},0)+(allAdj||[]).filter(function(a){return a.points>0}).reduce(function(s,a){return s+a.points},0);

  var {data:givenRedemptions}=await client.from('redemptions').select('*').eq('child_id',childId).eq('status','given').order('decided_at',{ascending:false});
  var {data:myBadges}=await client.from('badges').select('*').eq('child_id',childId);

  var {data:recentLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').order('validated_at',{ascending:false}).limit(6);
  var feed=[];
  (recentLogs||[]).forEach(function(l){ feed.push({type:'task', label:l.title, points:l.points, at:l.validated_at||l.date}); });
  (givenRedemptions||[]).slice(0,6).forEach(function(r){ feed.push({type:'reward', label:(r.emoji?r.emoji+' ':'')+r.title, points:-r.cost, at:r.decided_at}); });
  feed.sort(function(a,b){ return new Date(b.at)-new Date(a.at); });

  var corrData=await loadCorrData(childId);
  var rvWeek=(function(){ var dw=dowOf(todayStr()); return (dw===6||dw===0)?mondayOf(todayStr()):addDays(mondayOf(todayStr()),-7); })();
  var review={week:rvWeek,off:false,done:false,shared:false,content:null};
  try{
    var {data:rst,error:rstErr}=await client.rpc('weekly_review_status',{p_week:rvWeek});
    if(rstErr) review.off=true;
    else {
      var mineR=(rst||[]).filter(function(x){return x.child_id===childId})[0];
      if(mineR){ review.done=!!mineR.done; review.shared=!!mineR.shared; }
      if(review.shared){
        var {data:rc}=await client.from('weekly_reviews').select('answers,pride,goal').eq('child_id',childId).eq('week',rvWeek).maybeSingle();
        review.content=rc||null;
      }
    }
  }catch(e){ review.off=true; }

}

function isDueOn(t,dateStr){ if(t.freq==='weekly') return (t.days||[]).indexOf(dowOf(dateStr))>-1; return true; }

async function awardBadge(childId,badgeId,scope,period,reward){
  var {data:existing,error:cErr}=await client.from('badges').select('id').eq('child_id',childId).eq('badge_id',badgeId).eq('period',period);

async function checkBadges(childId){
  var d=todayStr(), monday=mondayOf(d);
  var {data:rangeLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',monday).lte('date',d);
  var logs=rangeLogs||[];
  function ownValidated(dateStr){ return logs.filter(function(l){return l.date===dateStr}); }
  function taskOf(l){ return S.tasks.filter(function(t){return t.id===l.task_id})[0]; }
  function strictRoutineDay(dateStr){
    var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,dateStr)&&(!t.created_at||t.created_at.slice(0,10)<=dateStr)});
    if(!due.length) return 'none';
    var v=ownValidated(dateStr);
    return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
  }

  if(ownValidated(d).length>=1) await awardBadge(childId,'kickoff','day',d,1);
  if(strictRoutineDay(d)==='ok') await awardBadge(childId,'perfectday','day',d,1);
  if(ownValidated(d).some(function(l){var t=taskOf(l); return t&&!t.recurring})) await awardBadge(childId,'helpinghand','day',d,1);

  if(dowOf(d)===1){
    var prevMonday=addDays(monday,-7);
    var {data:prevWeekLogs}=await client.from('task_logs').select('*').eq('child_id',childId).eq('status','validated').gte('date',prevMonday).lt('date',monday);
    var pLogs=prevWeekLogs||[];
    function pOwnValidated(dateStr){ return pLogs.filter(function(l){return l.date===dateStr}); }
    function pStrictRoutineDay(dateStr){
      var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,dateStr)&&(!t.created_at||t.created_at.slice(0,10)<=dateStr)});
      if(!due.length) return 'none';
      var v=pOwnValidated(dateStr);
      return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
    }
    var days=weekDatesFull(prevMonday), any=false, bad=false;
    days.forEach(function(x){ var k=pStrictRoutineDay(x); if(k==='ok')any=true; else if(k==='miss')bad=true; });
    if(any&&!bad) await awardBadge(childId,'perfectweek','week',prevMonday,5);
    if(days.every(function(x){return pOwnValidated(x).length>=5})) await awardBadge(childId,'ironregular','week',prevMonday,1);
  }

  var weekDays=weekDatesUpTo(d), specialCount=0, starSum=0;
  weekDays.forEach(function(x){
    var v=ownValidated(x);
    specialCount+=v.filter(function(l){var t=taskOf(l); return t&&!t.recurring}).length;
    starSum+=v.reduce(function(s,l){return s+l.points},0);
  });
  if(specialCount>=3) await awardBadge(childId,'bonushunter','week',monday,1);
  if(starSum>=40) await awardBadge(childId,'steadyeffort','week',monday,1);
}

function dayCheckKey(){ return 'mf_daycheck_'+S.me.id; }
async function checkYesterday(){
  try{
    var today=todayStr();
    if(lsGet(dayCheckKey())===today) return;
    var d=addDays(today,-1);
    var {data:logs,error}=await client.from('task_logs').select('task_id,child_id').eq('family_id',S.profile.family_id).eq('date',d);
    if(error){ console.error('daycheck',error); return; }
    var items=[];
    S.children.forEach(function(c){
      var paused=S.pauses.some(function(p){return (p.child_id===c.id||!p.child_id)&&p.from_date<=d&&(!p.to_date||p.to_date>=d)});
      if(paused) return;
      var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,c.id)&&isDueOn(t,d)&&(!t.created_at||t.created_at.slice(0,10)<=d)});
      var mine=(logs||[]).filter(function(l){return l.child_id===c.id});
      var missing=due.filter(function(t){return !mine.some(function(l){return l.task_id===t.id})});
      if(missing.length) items.push({child:c,tasks:missing});
    });
    if(items.length) ui.dayCheck={date:d,items:items,sel:{}};
    else { ui.dayCheck=null; lsSet(dayCheckKey(),today); }
  }catch(e){ console.error('daycheck',e); }
}

function collapseEl(el){
  return new Promise(function(res){
    if(!el||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ setTimeout(res,0); return; }
    el.style.setProperty('--h',el.getBoundingClientRect().height+'px');
    el.classList.add('leaving'); setTimeout(res,460);
  });
}
function animateRow(row,pts,delay,kind,label){
  return new Promise(function(res){
    if(!row||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ setTimeout(res,0); return; }
    setTimeout(function(){
      var r=row.getBoundingClientRect();
      row.style.setProperty('--h',r.height+'px');
      row.classList.add(kind==='no'?'row-out-no':(kind==='flash'?'row-flash':'row-out'));
      if(kind!=='no'){
        var t=document.createElement('div'); t.className='float-star'; t.textContent=label||('+'+pts+' ⭐');
        t.style.left=Math.max(8,r.right-90)+'px'; t.style.top=(r.top+r.height/2-14)+'px';
        document.body.appendChild(t); setTimeout(function(){t.remove()},1200);
        for(var i=0;i<8;i++){
          var sp=document.createElement('span'); sp.className='spark'; sp.textContent=i%2?'✨':'⭐';
          var a=Math.PI*2*i/8;
          sp.style.left=(r.right-60)+'px'; sp.style.top=(r.top+r.height/2)+'px';
          sp.style.setProperty('--dx',Math.round(Math.cos(a)*46)+'px'); sp.style.setProperty('--dy',Math.round(Math.sin(a)*46)+'px');
          document.body.appendChild(sp); (function(n){setTimeout(function(){n.remove()},900)})(sp);
        }
      }
      setTimeout(res,kind==='no'?600:700);
    },delay||0);
  });
}

function starStats(c){
  var daily=0, partial=0, perDow=[0,0,0,0,0,0,0], routinePts=0;
  S.tasks.forEach(function(t){
    if(!t.recurring||!appliesToList(t,c.id)) return;
    var pts=t.points||0;
    if(t.freq==='weekly'){ var dd=t.days||[]; partial+=pts*dd.length; routinePts+=pts*dd.length; dd.forEach(function(dw){perDow[dw]++}); }
    else { daily+=pts*7; routinePts+=pts*7; for(var i=0;i<7;i++) perDow[i]++; }
  });
  var brw=function(id){ var d=badgeDef(id); return d?d.reward:0; };
  var dueDays=perDow.filter(function(n){return n>0}).length;
  var badgesWeek=dueDays*(brw('kickoff')+brw('perfectday'))+(dueDays?brw('perfectweek'):0)+(routinePts>=40?brw('steadyeffort'):0)+(perDow.every(function(n){return n>=5})?brw('ironregular'):0);
  var potWeek=routinePts+badgesWeek;
  var logs=(S.recentLogs||[]).filter(function(l){return l.child_id===c.id});
  var bdg=(S.recentBadges||[]).filter(function(b){return b.child_id===c.id});
  var real=null;
  if(logs.length||bdg.length){
    var dates=logs.map(function(l){return l.date}).concat(bdg.map(function(b){return b.period})).sort();
    var span=Math.round((new Date(todayStr())-new Date(dates[0]))/864e5)+1;
    var days=Math.min(28,Math.max(7,span));
    real=(logs.reduce(function(t,l){return t+(l.points||0)},0)+bdg.reduce(function(t,b){return t+(b.reward||0)},0))/days;
  }
  return {dailyDay:daily/7, partialWeek:partial, routinesWeek:routinePts, badgesWeek:badgesWeek, potWeek:potWeek, potDay:potWeek/7, realDay:real, realWeek:real==null?null:real*7};
}

function accStarsIn(ctx,from,to){
  var n=0;
  ctx.logs.forEach(function(l){ if(l.status==='validated'&&l.date>=from&&l.date<=to) n+=l.points||0; });
  ctx.badges.forEach(function(b){ if(b.period>=from&&b.period<=to) n+=b.reward||0; });
  return n;
}
function accDone(l){ return l.status==='validated'||l.status==='pending'; }
// Évalue une condition : {ok, text, calendar}
function accEvalCond(c,ctx){
  var today=ctx.today;
  if(c.type==='routines'){
    var slots=c.slots||[], lab=accSlotLabel(slots);
    var due=accPausedOn(ctx,today)?[]:ctx.routines.filter(function(t){
      return isDueOn(t,today)&&(!t.created_at||t.created_at.slice(0,10)<=today)&&(!slots.length||slots.indexOf(t.slot||'none')>-1);
    });
    var rem=due.filter(function(t){return !ctx.logs.some(function(l){return l.task_id===t.id&&l.date===today&&accDone(l)})});
    return rem.length?{ok:false,text:'Il te reste '+rem.length+' routine'+(rem.length>1?'s':'')+' '+lab}:{ok:true,text:'Routines '+lab+' faites'};
  }
  if(c.type==='stars'){
    var from,to;
    if(c.period==='today'){ from=to=today; }
    else if(c.period==='week'){ from=ctx.mon; to=today; }
    else { from=ctx.prevMon; to=addDays(ctx.mon,-1); }
    var n=accStarsIn(ctx,from,to), min=c.min;
    if(c.period!=='today'){
      var wk=c.period==='week'?ctx.mon:ctx.prevMon, paused=0;
      for(var i=0;i<7;i++){ if(accPausedOn(ctx,addDays(wk,i))) paused++; }
      min=paused>=7?0:Math.ceil(c.min*(7-paused)/7);
    }
    var per=accPeriodLabel(c.period);
    if(n>=min) return {ok:true,text:n+' ⭐ gagnées '+per+' (objectif : '+min+')'};
    return {ok:false,text:c.period==='lastweek'?('Il fallait '+min+' ⭐ la semaine passée (tu en as eu '+n+')'):('Encore '+(min-n)+' ⭐ à gagner '+per)};
  }
  if(c.type==='specials'){
    if(c.mode==='min_week'){
      var ids={}; ctx.specials.forEach(function(t){ids[t.id]=1});
      var cnt=ctx.logs.filter(function(l){return ids[l.task_id]&&l.date>=ctx.mon&&accDone(l)}).length+
              ctx.spLogs.filter(function(l){return l.date>=ctx.mon&&accDone(l)&&!ctx.logs.some(function(x){return x.task_id===l.task_id&&x.date===l.date})}).length;
      return cnt>=c.n?{ok:true,text:cnt+' mission(s) spéciale(s) cette semaine'}:{ok:false,text:'Encore '+(c.n-cnt)+' mission(s) spéciale(s) cette semaine'};
    }
    var open=ctx.specials.filter(function(t){return !ctx.spLogs.some(function(l){return l.task_id===t.id&&accDone(l)})});
    return open.length?{ok:false,text:'Termine ta mission spéciale en cours'+(open.length>1?' ('+open.length+')':'')}:{ok:true,text:'Aucune mission spéciale en cours'};
  }
  if(c.type==='streak'){
    return ctx.streak>=c.min?{ok:true,text:'Série de '+ctx.streak+' jour'+(ctx.streak>1?'s':'')}:{ok:false,text:'Série de '+ctx.streak+' jour'+(ctx.streak>1?'s':'')+' (objectif : '+c.min+')'};
  }
  if(c.type==='weekday'){
    return (c.days||[]).indexOf(ctx.dow)>-1?{ok:true,calendar:true,text:'C’est le bon jour !'}:{ok:false,calendar:true,text:'Disponible le '+accDaysLabel(c.days)};
  }
  var def=badgeDef(c.badge);
  if(!def) return {ok:true,text:'Badge indisponible'};
  var has=ctx.badges.some(function(b){return b.badge_id===def.id&&((def.scope==='day'&&b.period===today)||(def.scope==='week'&&b.period===ctx.mon))});
  return has?{ok:true,text:'Badge « '+def.name+' » obtenu'}:{ok:false,text:'Obtiens le badge « '+def.name+' »'};
}
function accRuleState(rule,ctx,row){
  var conds=(rule.conditions||[]).map(function(c){ var e=accEvalCond(c,ctx); e.cond=c; return e; });
  var allOk=conds.every(function(c){return c.ok});
  var missing=conds.filter(function(c){return !c.ok&&!c.calendar}).length;
  var calFail=conds.some(function(c){return !c.ok&&c.calendar});
  var state,via=null;
  if(row&&row.kind==='blocked') state='blocked';
  else if(row){ state='open'; via=row.kind; }
  else if(allOk){ state='open'; via='auto'; }
  else if(missing===0&&calFail) state='notToday';
  else state='locked';
  return {state:state,via:via,conds:conds,missing:missing,note:row?row.note:null};
}
function accTargets(rule){
  return S.children.filter(function(c){return !rule.child_ids||!rule.child_ids.length||rule.child_ids.indexOf(c.id)>-1});
}

async function loadMyAccess(){
  S.myAccess=[]; S.accessOff=false;
  try{
    var today=todayStr();
    var {data:rules,error}=await client.from('access_rules').select('*').eq('family_id',S.profile.family_id).eq('active',true).order('created_at');
    if(error){ S.accessOff=true; return; }
    rules=(rules||[]).filter(function(r){return !r.child_ids||!r.child_ids.length||r.child_ids.indexOf(S.me.id)>-1});
    if(!rules.length) return;
    var {data:ul}=await client.from('access_unlocks').select('*').eq('child_id',S.me.id).eq('date',today);
    var ctx=await accessContext(S.me.id), newly=[];
    for(var i=0;i<rules.length;i++){
      var r=rules[i], row=(ul||[]).filter(function(u){return u.rule_id===r.id})[0]||null;
      var st=accRuleState(r,ctx,row); st.rule=r;
      if(st.state==='open'&&!row){
        var {error:ie}=await client.from('access_unlocks').insert({family_id:S.profile.family_id,rule_id:r.id,child_id:S.me.id,date:today,kind:'earned'});
        if(!ie) newly.push({title:r.title,icon:r.icon});
      }
      S.myAccess.push(st);
    }
    if(newly.length) ui.accessUnlocked=(ui.accessUnlocked||[]).concat(newly);
  }catch(e){ console.error('access',e); S.accessOff=true; }
}

// Après une correction parent : retire les bonus « gagnés » aujourd'hui dont les conditions ne sont plus remplies.
// (Les accords et suspensions décidés à la main par le parent ne sont pas touchés.)
async function revokeUnlocks(childId){
  var out=[];
  try{
    var today=todayStr();
    var {data:ul}=await client.from('access_unlocks').select('rule_id').eq('child_id',childId).eq('date',today).eq('kind','earned');
    if(!ul||!ul.length) return out;
    var {data:rules}=await client.from('access_rules').select('*').eq('family_id',S.profile.family_id);
    var ctx=await accessContext(childId);
    for(var i=0;i<ul.length;i++){
      var r=(rules||[]).filter(function(x){return x.id===ul[i].rule_id})[0]; if(!r) continue;
      var st=accRuleState(r,ctx,null);
      if(st.state==='open'||st.missing===0) continue;
      var {data:del,error}=await client.from('access_unlocks').delete().eq('rule_id',r.id).eq('child_id',childId).eq('date',today).eq('kind','earned').select();
      if(!error&&del&&del.length) out.push(r.title);
    }
  }catch(e){ console.error('revokeUnlocks',e); }
  return out;
}

async function loadAccessAdmin(){
  await loadAccessLight();
  S.accessStatus={};

  var ctxs={};
  await Promise.all(S.children.map(async function(c){ ctxs[c.id]=await accessContext(c.id); }));
  S.accessRules.forEach(function(r){

function mvDiagText(){

  if(_mv.loaded){
    var need=['Idle','Walk','Run','Jump','Trick'], miss=need.filter(function(n){return _mv.anims.indexOf(n)<0;});
    return '✅ 3D actif ('+_mv.src+'.glb)'+(miss.length?' · animations manquantes : '+miss.join(', '):' · animations OK');

function mvDiagShow(){ var d=document.getElementById('mv-diag'); if(d) d.textContent=mvDiagText(); }
function mvFail(why){

}
function mascot3d(id){ return !_mv.failed?mascotOf(id):null; }

    document.head.appendChild(s);

// Retire un badge (et sa récompense en étoiles). Renvoie false si la suppression est refusée.
async function revokeBadgeRow(childId,row){
  var def=badgeDef(row.badge_id);
  var {data:dd,error}=await client.from('badges').delete().eq('id',row.id).select();
  if(error||!dd||!dd.length) return false;
  if(!row.reward) return true;
  var reason=def?def.emoji+' '+def.name:row.badge_id;
  var {data:adj}=await client.from('adjustments').select('id,created_at').eq('child_id',childId).eq('reason',reason).eq('points',row.reward);
  var t0=new Date(row.created_at).getTime(), best=null;
  (adj||[]).forEach(function(a){ var dt=Math.abs(new Date(a.created_at).getTime()-t0); if(dt<120000&&(!best||dt<best.dt)) best={id:a.id,dt:dt}; });
  if(best) await client.from('adjustments').delete().eq('id',best.id);
  else await client.from('adjustments').insert({family_id:S.profile.family_id,child_id:childId,points:-row.reward,reason:'↩️ Badge retiré : '+(def?def.name:row.badge_id)});
  return true;
}
// Recalcule les badges du jour concerné et de sa semaine : retire ceux qui ne sont plus mérités, attribue ceux qui le deviennent. Renvoie le nombre d'échecs de suppression.
async function reconcileBadges(childId,dateStr){
  var W=mondayOf(dateStr), weekEnd=addDays(W,6), ended=todayStr()>weekEnd, failed=0;
  var {data:wl}=await client.from('task_logs').select('task_id,date,points').eq('child_id',childId).eq('status','validated').gte('date',W).lte('date',weekEnd);
  var logs=wl||[];
  var vOn=function(d){ return logs.filter(function(l){return l.date===d}); };
  var isSp=function(l){ var t=S.tasks.filter(function(x){return x.id===l.task_id})[0]; return !!(t&&!t.recurring); };
  var strict=function(d){
    var due=S.tasks.filter(function(t){return t.recurring&&appliesToList(t,childId)&&isDueOn(t,d)&&(!t.created_at||t.created_at.slice(0,10)<=d)});
    if(!due.length) return 'none';
    var v=vOn(d); return due.every(function(t){return v.some(function(l){return l.task_id===t.id})})?'ok':'miss';
  };
  var exp={}; // clé "id|scope|period" -> récompense
  var add=function(id,scope,period,rw){ exp[id+'|'+scope+'|'+period]=rw; };
  if(vOn(dateStr).length>=1) add('kickoff','day',dateStr,1);
  if(strict(dateStr)==='ok') add('perfectday','day',dateStr,1);
  if(vOn(dateStr).some(isSp)) add('helpinghand','day',dateStr,1);
  var days=weekDatesFull(W);
  if(logs.filter(isSp).length>=3) add('bonushunter','week',W,1);
  if(logs.reduce(function(t,l){return t+(l.points||0)},0)>=40) add('steadyeffort','week',W,1);
  if(ended){
    var any=false,bad=false; days.forEach(function(d){ var k=strict(d); if(k==='ok') any=true; else if(k==='miss') bad=true; });
    if(any&&!bad) add('perfectweek','week',W,5);
    if(days.every(function(d){return vOn(d).length>=5})) add('ironregular','week',W,1);
  }
  var DAYB=['kickoff','perfectday','helpinghand'], WEEKB=['bonushunter','steadyeffort','perfectweek','ironregular'];
  var {data:ex}=await client.from('badges').select('*').eq('child_id',childId).in('period',[dateStr,W]);
  for(var i=0;i<(ex||[]).length;i++){
    var r=ex[i], key=r.badge_id+'|'+r.scope+'|'+r.period;
    var evaluated=(r.scope==='day'&&r.period===dateStr&&DAYB.indexOf(r.badge_id)>-1)||(r.scope==='week'&&r.period===W&&WEEKB.indexOf(r.badge_id)>-1);
    if(evaluated&&!(key in exp)){ if(!(await revokeBadgeRow(childId,r))) failed++; }
  }
  var keys=Object.keys(exp);
  for(var j=0;j<keys.length;j++){ var p=keys[j].split('|'); await awardBadge(childId,p[0],p[1],p[2],exp[keys[j]]); }
  return failed;
}

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,String(v));}catch(e){} }
async function checkCelebration(){
  try{
    var me=S.me.id, kLast='mf_seen_'+me, kLvl='mf_lvl_'+me;
    var last=lsGet(kLast), lastLvl=parseInt(lsGet(kLvl)||'0',10);
    var lvl=levelFor(S.earned||S.stars);
    if(lvl<lastLvl){ lsSet(kLvl,lvl); lastLvl=lvl; lsSet(kLast,new Date().toISOString()); last=lsGet(kLast); }
    if(!last){ lsSet(kLast,new Date().toISOString()); lsSet(kLvl,lvl); return; }
    var [rl,rr,rb,ra,rc]=await Promise.all([
      client.from('task_logs').select('title,points,validated_at').eq('child_id',me).eq('status','validated').gt('validated_at',last).order('validated_at'),
      client.from('redemptions').select('title,emoji,cost,status,decided_at').eq('child_id',me).in('status',['given','refused']).gt('decided_at',last).order('decided_at'),
      client.from('badges').select('id,badge_id,reward,created_at').eq('child_id',me).gt('created_at',last).order('created_at'),
      client.from('adjustments').select('points,reason,created_at').eq('child_id',me).gt('created_at',last).order('created_at'),
      client.from('log_corrections').select('title,points,comment,created_at,restored').eq('child_id',me).gt('created_at',last).order('created_at')
    ]);
    var corr=((rc&&rc.data)||[]).filter(function(x){return !x.restored});
    var missions=rl.data||[], gifts=(rr.data||[]).filter(function(r){return r.status==='given'}), refused=(rr.data||[]).filter(function(r){return r.status==='refused'});
    var badges=(rb.data||[]).filter(function(b){return badgeDef(b.badge_id)});
    var bonus=(ra.data||[]).filter(function(a){
      var r=a.reason||''; if(r.indexOf('🎁 ')===0) return false;
      return !BADGE_DEFS.some(function(b){return r===b.emoji+' '+b.name||r===b.id});
    });
    var levelUp=lvl>lastLvl&&lastLvl>0;
    if(!missions.length&&!gifts.length&&!refused.length&&!badges.length&&!bonus.length&&!levelUp&&!corr.length){
      if(lvl>lastLvl) lsSet(kLvl,lvl);
      return;
    }
    var stars=0;
    missions.forEach(function(m){stars+=m.points||0});
    badges.forEach(function(b){stars+=b.reward||0});
    bonus.forEach(function(a){stars+=a.points||0});
    var stamps=[].concat(missions.map(function(x){return x.validated_at}),(rr.data||[]).map(function(x){return x.decided_at}),badges.map(function(x){return x.created_at}),bonus.map(function(x){return x.created_at}),corr.map(function(x){return x.created_at})).filter(Boolean).sort();
    var colors=['#FF6B5E','#FFD166','#22B26B','#6C5CE7','#4FC3F7'], conf='';
    for(var i=0;i<28;i++) conf+='<i style="left:'+Math.round(Math.random()*100)+'%;background:'+colors[i%colors.length]+';animation-duration:'+(2.4+Math.random()*2.4).toFixed(1)+'s;animation-delay:-'+(Math.random()*4).toFixed(1)+'s"></i>';
    var notice=corr.length>0&&!missions.length&&!gifts.length&&!badges.length&&!levelUp&&!bonus.some(function(a){return a.points>0});
    ui.celebrate={corr:corr,notice:notice,missions:missions,gifts:gifts,refused:refused,badges:badges,bonus:bonus,stars:stars,levelUp:levelUp?{lvl:lvl,title:levelTitle(lvl)}:null,lvl:lvl,stamp:stamps.length?stamps[stamps.length-1]:last,conf:conf};
  }catch(e){ console.error('celebration error',e); }
}

  if(c.bonus.length){ h+='<div class="cel-sec">Bonus</div>'+c.bonus.map(function(a){return row(a.points>=0?'✨':'⭐',esc(a.reason||'Ajustement'),(a.points>=0?'+':'')+a.points+' ⭐');}).join(''); }
  if(c.gifts.length){ h+='<div class="cel-sec">Cadeaux accordés</div>'+c.gifts.map(function(g){return row(g.emoji||'🎁',esc(g.title)+' est à toi !','');}).join(''); }
  if(c.refused.length){ h+='<div class="cel-sec">Demandes</div>'+c.refused.map(function(g){return row('💬','Pas cette fois pour « '+esc(g.title)+' »','',true);}).join(''); }
  if(corrRows) h+='<div class="cel-sec">Modifié par tes parents</div>'+corrRows;
  if(c.stars>0) h+='<div class="cel-total">+<span data-count="'+c.stars+'">0</span> ⭐</div>';
  h+='<button class="btn go wide" data-a="closeCelebrate">Super !</button></div></div>';
  return h;
}
function runCountUps(){

    function step(ts){ if(t0===null) t0=ts; var k=Math.min(1,(ts-t0)/dur); el.textContent=Math.round(to*(0.5-Math.cos(Math.PI*k)/2)); if(k<1&&document.body.contains(el)) requestAnimationFrame(step); else el.textContent=to; }

var _tour=null, _tourTimer=null;
function tourUid(){ return (S.me&&S.me.id)||'anon'; }
function tourStoreKey(page){ return 'mf_tour_'+tourUid()+'_'+page; }
function tourPage(){
  if(ui.view==='parent') return 'parent_'+ui.ptab;
  if(ui.view==='childDetail') return 'parent_detail';
  if(ui.view==='child') return 'child_'+ui.tab;
  return null;
}
function tourRolePages(page){ var pre=page.indexOf('parent_')===0?'parent_':'child_'; return Object.keys(TOURS).filter(function(k){return k.indexOf(pre)===0}); }
function tourReset(pages){ pages.forEach(function(p){ try{localStorage.removeItem(tourStoreKey(p))}catch(e){} }); }
function tourCheck(){
  clearTimeout(_tourTimer);
  _tourTimer=setTimeout(function(){
    if(_tour||!S.me||ui.celebrate) return;
    var page=tourPage(); if(!page||!TOURS[page]||lsGet(tourStoreKey(page))==='1') return;
    if(document.querySelector('.modal-backdrop,.dlg-back,.cel-back')) return;
    tourStart(page);
  },700);
}
function tourStart(page){
  if(_tour) return;
  var steps=TOURS[page].filter(function(st){ return !st.sel||document.querySelector(st.sel); });
  if(!steps.length) return;
  var root=document.createElement('div'); root.id='tour';
  root.innerHTML='<div class="tour-dim"></div><div class="tour-hole" style="display:none"></div><div class="tour-tip" role="dialog" aria-live="polite"></div>';
  document.body.appendChild(root);
  var stop=function(e){ if(!e.target.closest||!e.target.closest('.tour-tip')) e.preventDefault(); };
  root.addEventListener('touchmove',stop,{passive:false});
  root.addEventListener('wheel',stop,{passive:false});
  root.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-tk]'); if(!b) return;
    e.stopPropagation();
    var k=b.getAttribute('data-tk');
    if(k==='next') tourGo(1); else if(k==='prev') tourGo(-1); else if(k==='skip') tourEnd(false); else if(k==='all') tourEnd(true);
  });
  _tour={page:page,steps:steps,i:0,root:root,onKey:function(e){
    if(e.key==='Escape'){ e.preventDefault(); tourEnd(false); }
    else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); tourGo(1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); tourGo(-1); }
  },onResize:function(){ tourPlace(); }};
  document.addEventListener('keydown',_tour.onKey,true);
  window.addEventListener('resize',_tour.onResize);
  tourShow();
}
function tourGo(d){
  if(!_tour) return;
  var n=_tour.i+d;
  if(n>=_tour.steps.length) return tourEnd(false);
  if(n<0) return;
  _tour.i=n; tourShow();
}
function tourEnd(all){
  if(!_tour) return;
  var t=_tour; _tour=null;
  (all?tourRolePages(t.page):[t.page]).forEach(function(p){ lsSet(tourStoreKey(p),'1'); });
  document.removeEventListener('keydown',t.onKey,true);
  window.removeEventListener('resize',t.onResize);
  t.root.remove();
}
function tourShow(){
  var t=_tour, st=t.steps[t.i];
  var el=st.sel?document.querySelector(st.sel):null;
  if(st.sel&&!el){ if(t.i<t.steps.length-1){ t.i++; return tourShow(); } return tourEnd(false); }
  if(el&&el.scrollIntoView) el.scrollIntoView({block:'center',inline:'nearest'});
  var tip=t.root.querySelector('.tour-tip'), last=t.i===t.steps.length-1;
  var dots=t.steps.map(function(_,k){return '<i'+(k===t.i?' class="on"':'')+'></i>'}).join('');
  tip.innerHTML='<div class="tour-arrow" style="display:none"></div><h4>'+esc(st.title)+'</h4><p>'+esc(st.text)+'</p>'+
    '<div class="tour-foot"><div class="tour-dots">'+dots+'</div>'+
    (last?'':'<button type="button" class="tour-skip" data-tk="skip">Passer</button>')+
    (t.i>0?'<button type="button" class="btn ghost small" data-tk="prev" aria-label="Précédent">‹</button>':'')+
    '<button type="button" class="btn small" data-tk="next">'+(last?'Compris !':'Suivant ›')+'</button></div>'+
    (t.i===0?'<button type="button" class="tour-all" data-tk="all">Ne plus afficher le tutoriel</button>':'');
  tip.style.animation='none'; void tip.offsetHeight; tip.style.animation='';
  tourPlace();
}
function tourPlace(){
  if(!_tour) return;
  var t=_tour, st=t.steps[t.i];
  var el=st.sel?document.querySelector(st.sel):null;
  if(st.sel&&!el) return tourShow();
  var root=t.root, hole=root.querySelector('.tour-hole'), dim=root.querySelector('.tour-dim'), tip=root.querySelector('.tour-tip'), arrow=tip.querySelector('.tour-arrow');
  var vw=window.innerWidth, vh=window.innerHeight, pad=6, r=null;
  if(el){
    r=el.getBoundingClientRect();
    hole.style.display='block'; dim.style.display='none';
    hole.style.left=(r.left-pad)+'px'; hole.style.top=(r.top-pad)+'px'; hole.style.width=(r.width+pad*2)+'px'; hole.style.height=(r.height+pad*2)+'px';
  } else { hole.style.display='none'; dim.style.display='block'; }
  var tw=Math.min(340,vw-24);
  tip.style.width=tw+'px'; tip.style.left='0px'; tip.style.top='0px';
  var th=tip.offsetHeight, left, top, side=null;
  if(!r){ left=(vw-tw)/2; top=Math.max(12,(vh-th)/2); }
  else {
    var below=vh-(r.bottom+pad)-14, above=r.top-pad-14;
    if(th+8<=below){ top=r.bottom+pad+12; side='top'; }
    else if(th+8<=above){ top=r.top-pad-12-th; side='bottom'; }
    else { top=Math.max(12,vh-th-12); }
    left=Math.min(Math.max(r.left+r.width/2-tw/2,12),vw-tw-12);
  }
  tip.style.left=left+'px'; tip.style.top=top+'px';
  tip.classList.toggle('at-top',side==='top'); tip.classList.toggle('at-bottom',side==='bottom');
  if(side&&r){ arrow.style.display='block'; arrow.style.left=Math.min(Math.max(r.left+r.width/2-left-7,18),tw-32)+'px'; } else arrow.style.display='none';
}

/* ---------- boîtes de dialogue (remplacent prompt / confirm / alert) ---------- */
var _openAlerts={};
function askDialog(o){
  return new Promise(function(resolve){
    var back=document.createElement('div'); back.className='dlg-back';
    var box=document.createElement('div'); box.className='dlg'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
    var multi=!!o.multiline, h='';
    if(o.icon) h+='<div class="dlg-ico">'+o.icon+'</div>';
    if(o.title) h+='<h3 class="dlg-title">'+esc(o.title)+'</h3>';
    if(o.message) h+='<p class="dlg-msg">'+esc(o.message).replace(/\n/g,'<br>')+'</p>';
    if(o.input){
      if(o.label) h+='<label class="dlg-lbl">'+esc(o.label)+'</label>';
      h+=(multi?'<textarea class="inp" rows="3"':'<input class="inp" type="'+(o.type||'text')+'"')+' placeholder="'+esc(o.placeholder||'')+'" autocomplete="off"'+(multi?'>'+esc(o.value||'')+'</textarea>':' value="'+esc(o.value||'')+'">');
      h+='<p class="dlg-err" hidden></p>';
    }
    h+='<div class="dlg-btns">'+(o.cancelLabel===null?'':'<button type="button" class="btn ghost" data-k="cancel">'+esc(o.cancelLabel||'Annuler')+'</button>')+
       '<button type="button" class="btn'+(o.danger?' danger':'')+'" data-k="ok">'+esc(o.okLabel||'OK')+'</button></div>';
    box.innerHTML=h; back.appendChild(box); document.body.appendChild(back);
    var inp=box.querySelector('.inp'), errEl=box.querySelector('.dlg-err');
    var prev=document.activeElement, done=false;
    function close(val){
      if(done) return; done=true;
      document.removeEventListener('keydown',onKey,true);
      back.classList.add('out'); setTimeout(function(){back.remove()},170);
      if(prev&&prev.focus){ try{prev.focus()}catch(e){} }
      resolve(val);
    }
    function cancel(){ close(o.input?null:false); }
    function submit(){
      if(o.input){
        var v=inp.value;
        if(o.validate){ var er=o.validate(v); if(er){ errEl.textContent=er; errEl.hidden=false; inp.focus(); return; } }
        close(v);
      } else close(true);
    }
    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); if(o.cancelLabel===null) submit(); else cancel(); }
      else if(e.key==='Enter' && !(multi&&!e.ctrlKey&&!e.metaKey) && !(e.target&&e.target.tagName==='BUTTON')){ e.preventDefault(); e.stopPropagation(); submit(); }
    }
    document.addEventListener('keydown',onKey,true);
    back.addEventListener('click',function(e){ if(e.target===back){ if(o.cancelLabel===null) submit(); else cancel(); } });
    box.querySelector('[data-k="ok"]').addEventListener('click',submit);
    var cb=box.querySelector('[data-k="cancel"]'); if(cb) cb.addEventListener('click',cancel);
    setTimeout(function(){ var f=inp||box.querySelector('[data-k="ok"]'); if(f){ f.focus(); if(inp&&inp.select&&o.type!=='password') inp.select(); } },60);
  });
}
function askConfirm(o){ return askDialog(Object.assign({icon:'❓',okLabel:'Confirmer'},o)); }
function askPrompt(o){ return askDialog(Object.assign({input:true,okLabel:'Valider'},o)); }
function showAlert(msg,o){
  msg=String(msg==null?'':msg);
  var m=msg.match(/^(❌|⚠️|✅)\s*/), icon=m?m[1]:'ℹ️', text=m?msg.slice(m[0].length):msg;
  if(_openAlerts[text]) return _openAlerts[text];
  var title=(o&&o.title)||(icon==='❌'?'Une erreur est survenue':icon==='⚠️'?'Attention':'Information');
  var pr=askDialog({icon:icon,title:title,message:text,okLabel:'OK',cancelLabel:null}).then(function(){ delete _openAlerts[text]; });
  _openAlerts[text]=pr; return pr;
}

/* Bloque le défilement de la page derrière une fenêtre ouverte */
(function(){
  var raf=0;
  function sync(){ raf=0; document.documentElement.classList.toggle('modal-open',!!document.querySelector('.modal-backdrop,.dlg-back')); }
  function go(){ if(!raf) raf=requestAnimationFrame(sync); }
  function start(){ new MutationObserver(go).observe(document.body,{childList:true,subtree:true}); go(); }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
})();
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');

}

  doTask:async function(d,el){
    var tk=(S.tasks||[]).filter(function(x){return x.id===d.id})[0];
    if(morningClosed(tk)){ showAlert('🔒 Les routines du matin se valident avant 11 h. Demande à un parent si tu l’as faite !'); render(); return; }
    if(checklistBlocked(d.id)) return;
    if(ui._sending&&ui._sending[d.id]) return;
    ui._sending=ui._sending||{}; ui._sending[d.id]=true; if(el) el.disabled=true;
    try{
      var ex=await logToday(S.me.id,d.id);
      if(ex){ await refreshChildScreen(); return; }
      var {error}=await client.from('task_logs').insert({
        family_id:S.profile.family_id, task_id:d.id, child_id:S.me.id, title:d.title, points:+d.points, status:'pending', date:todayStr()
      });
      if(error){ showAlert('❌ '+error.message); if(el) el.disabled=false; return; }
      if(KID_TASKS[d.id]) chkClear(KID_TASKS[d.id]);
      ui._astFx='cheer';
      toast('⏳ Envoyé à tes parents pour validation');
      await refreshChildScreen();
    } finally { ui._sending[d.id]=false; }
  },
  doSpecial:async function(d){
    if(checklistBlocked(d.id)) return;

  openChildMenu:function(d){ ui.childMenu=d.id; render(); },
  closeChildMenu:function(){ ui.childMenu=null; render(); },
  menuRenameChild:function(d){ ui.childMenu=null; A.renameChild({id:d.id}); },
  menuResetChild:function(d){ ui.childMenu=null; A.resetChild({id:d.id, name:d.name}); },
  resetChild:async function(d){
    var name=d.name||'cet enfant';
    if(!(await askConfirm({icon:'🚨',title:'Réinitialiser '+name+' ?',message:'Vont être effacés DÉFINITIVEMENT :\n• toutes ses étoiles et son niveau\n• tous ses badges\n• tout son historique de missions et de cadeaux\n\nCette action est IRRÉVERSIBLE.',okLabel:'Je comprends, continuer',danger:true}))) return;
    var typed=await askPrompt({icon:'⛔',title:'Dernière confirmation',message:'Tout ce que '+name+' a accumulé sera perdu pour toujours. Il n’y a aucun moyen d’annuler.',label:'Pour confirmer, écris son prénom : '+name,placeholder:name,okLabel:'Tout effacer',danger:true,validate:function(v){return v.trim().toLowerCase()===name.trim().toLowerCase()?null:'Le prénom ne correspond pas.';}});
    if(typed===null) return;
    var {error}=await client.rpc('reset_child',{p_child:d.id});
    if(error){ showAlert('❌ Réinitialisation impossible : '+error.message+'\n\nVérifie que la fonction SQL « reset_child » a bien été créée dans Supabase.'); return; }
    toast('🔄 '+name+' repart de zéro');
    await refreshParentScreen();
  },
  menuDeleteChild:function(d){ ui.childMenu=null; A.deleteChild({id:d.id, name:d.name}); },
  openRewardMenu:function(d){ ui.rewardMenu=d.id; _rewardMenuOpenedAt=Date.now(); render(); },
  closeRewardMenu:function(){ if(Date.now()-_rewardMenuOpenedAt<400) return; ui.rewardMenu=null; render(); },
  menuEditReward:function(d){ ui.rewardMenu=null; A.editReward({id:d.id}); },
  menuDeleteReward:async function(d){ ui.rewardMenu=null; render(); await A.deleteReward({id:d.id}); },
  decideRedemption:async function(d,el){
    var row=el&&el.closest?el.closest('.task'):null;
    var anim=animateRow(row,0,0,d.decision==='given'?'ok':'no','🎁');
    var {error}=await client.from('redemptions').update({status:d.decision, decided_at:new Date().toISOString()}).eq('id',d.id);
    if(error){ unanimateRow(row); showAlert('❌ '+error.message); return; }
    if(d.decision==='given'){
      await client.from('adjustments').insert({family_id:S.profile.family_id, child_id:d.cid, points:-parseInt(d.cost,10), reason:'🎁 '+d.label});
      await recalcBalance(d.cid);
    }
    toast(d.decision==='given'?'🎁 Récompense donnée':'Demande refusée');
    await anim;
    await refreshParentScreen();
    closeValidateIfDone();
  },

  /* récompenses (enfant) */
  cancelRedemption:async function(d,btn){
    if(!(await askConfirm({icon:'↩️',title:'Annuler ta demande ?',message:'Ta demande de récompense sera retirée.',okLabel:'Oui, annuler',cancelLabel:'Non, la garder'}))) return;
    if(btn) btn.disabled=true;
    var {data,error}=await client.from('redemptions').delete().eq('id',d.id).eq('child_id',S.me.id).eq('status','pending').select();
    if(error){ if(btn) btn.disabled=false; showAlert('❌ '+error.message); return; }
    if(!data||!data.length){
      toast('Cette demande a déjà été traitée par tes parents');
    } else toast('↩️ Demande annulée');
    await refreshChildScreen();
  },
  requestReward:async function(d, btn){
    if(btn){ btn.disabled=true; btn.textContent='...'; }
    if(S.stars<+d.cost){ showAlert('Pas assez d’étoiles pour cette récompense.'); if(btn){btn.disabled=false; btn.textContent='Demander';} return; }
    var rw=S.rewards.filter(function(x){return x.id===d.id})[0], lk=rw?rewardLock(rw):null;
    if(lk){ showAlert('⚠️ Cette récompense sera de nouveau disponible le '+fmtShort(lk.date)+'.'); await refreshChildScreen(); return; }
    var already=(S.myRedemptions||[]).some(function(r){return r.reward_id===d.id&&r.status==='pending'});
    if(already){ await refreshChildScreen(); return; }
    var {error}=await client.from('redemptions').insert({family_id:S.profile.family_id, child_id:S.me.id, reward_id:d.id, title:d.title, emoji:d.emoji||null, cost:+d.cost, status:'pending'});
    if(error){ showAlert('❌ '+error.message); return; }
    toast('🎁 Demande envoyée !');
    await refreshChildScreen();
  }
};

/* appui long sur une carte de mission -> menu Assigner/Éditer/Supprimer */
var _lpTimer=null, _taskMenuOpenedAt=0, _rewardMenuOpenedAt=0;
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest?e.target.closest('[data-longpress]'):null;
  if(el){
    var id=el.getAttribute('data-longpress');
    _lpTimer=setTimeout(function(){ _lpTimer=null; A.openTaskMenu({id:id}); },500);
    return;
  }
  var rel=e.target.closest?e.target.closest('[data-longpress-reward]'):null;
  if(rel){
    var rid=rel.getAttribute('data-longpress-reward');
    _lpTimer=setTimeout(function(){ _lpTimer=null; A.openRewardMenu({id:rid}); },500);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(function(evt){
  document.addEventListener(evt,function(){ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } });
});

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el)return;
  var fn=A[el.getAttribute('data-a')];
  if(fn)fn(el.dataset, el);
});
document.addEventListener('input',function(e){
  var el=e.target, f=el.dataset && el.dataset.field;
  if(!f) return;
  if(f==='ntitle'){ ui.newTitle=el.value; if(!ui.newIconManual) ui.newIcon=autoIcon(el.value); refreshIconUI(el.value); }
  else if(f==='npoints') ui.newPoints=el.value;
  else if(f==='stitle'){ ui.newSTitle=el.value; if(!ui.newIconManual) ui.newIcon=autoIcon(el.value); refreshIconUI(el.value); }
  else if(f==='ndetails') ui.newDetails=el.value;
  else if(f==='accTitle'&&ui.accessForm){ ui.accessForm.title=el.value; if(!ui.newIconManual) ui.newIcon=autoIcon(el.value); refreshIconUI(el.value); }
  else if(f==='accN'&&ui.accessForm){ var _c=ui.accessForm.conds[parseInt(el.dataset.i,10)]; if(_c) _c[el.dataset.k]=el.value; }
  else if(f==='corrComment'&&ui.corr) ui.corr.comment=el.value;
  else if(f==='vigPoint'&&ui.vig){
    ui.vig.point=el.value;
    var _pv=document.getElementById('vig-prev'); if(_pv) _pv.innerHTML=vigPreviewInner();
    var _ok=document.getElementById('vig-ok'); if(_ok) _ok.disabled=vigClean(el.value).length<3;
    var _tp=document.getElementById('vig-tip'); if(_tp) _tp.style.display=vigNegative(el.value)?'':'none';
  }
  else if(f==='mascotName'&&ui.mascotMenu) ui.mascotMenu.name=el.value;
  else if(f==='cityQ'&&ui.cityForm) ui.cityForm.q=el.value;
  else if(f==='revpride'&&ui.review) ui.review.pride=el.value;
  else if(f==='revgoal'&&ui.review) ui.review.goal=el.value;
  else if(f==='iconSearch'){ ui.iconSearch=el.value; var g=document.getElementById('ico-results'); if(g) g.innerHTML=iconResultsHtml(el.value); }
  else if(f==='spoints') ui.newSPoints=el.value;
  else if(f==='pauseFrom') ui.pauseFrom=el.value;
  else if(f==='pauseTo') ui.pauseTo=el.value;
  else if(f==='pauseReason') ui.pauseReason=el.value;
  else if(f==='pauseChild') ui.pauseChild=el.value;
  else if(f==='adjChild') ui.adjChild=el.value;
  else if(f==='adjPoints') ui.adjPoints=el.value;
  else if(f==='adjReason') ui.adjReason=el.value;
  else if(f==='rTitle') ui.rTitle=el.value;
  else if(f==='rEmoji') ui.rEmoji=el.value;
  else if(f==='rCost') ui.rCost=el.value;
});
document.addEventListener('change',function(e){
  var el=e.target, f=el.dataset && el.dataset.field;
  if(f==='iconFile'){ var fl=el.files&&el.files[0]; el.value=''; A.uploadIcon(fl); return; }
  if(f&&f.indexOf('acc')===0&&el.tagName==='SELECT'&&el.dataset.i!=null){ A.accSet(el.dataset.i,f,el.value); return; }
  if(!f || el.tagName!=='SELECT') return;
  if(f==='pauseChild') ui.pauseChild=el.value;
  else if(f==='adjChild') ui.adjChild=el.value;
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(ui.cityForm&&e.target&&e.target.dataset&&e.target.dataset.field==='cityQ'){ A.citySearch(); return; }
  if(ui.view==='parentlogin') A.doParentLogin();
  else if(ui.view==='kidlogin') A.doChildPair();
});

applyThemeMeta();
boot();
})();
</script>
